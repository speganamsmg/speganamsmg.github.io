<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tangga Karakter — Menjadi Remaja Berkarakter Melalui Ibadah | Game BK</title>
<meta name="description" content="Game BK sesuai RPL Bimbingan Klasikal: Menjadi Remaja Berkarakter Melalui Ibadah. Ular tangga berkelompok, dikendalikan guru.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--c1:#3BA776;--c1d:#2A8559;--c2:#F2B84B;--c3:#DDF3E7}
:root,:root[data-theme=light]{--rk0:#A9B4C2;--g1:#B5EA70;--g2:#4FA85A;--cl:#FFFFFF;--cl2:#D6E8F6;--win:#9FD4FF;--ff:0;--w1:#9ADBEE;--w2:#58B4D4;--sand:#F6E0AC;--sk1:#7EC8F2;--sk2:#BDE6F7;--sk3:#FFF1D6;--sunc:#FFD86B;--rk:#7F8FA6;--rk2:#4C5C75;--cl:#fff;--fg:#2E6B4E;--stars:0;--bg:#FFF7EC;--bg2:#FFEDD3;--card:#FFFFFF;--ink:#2D2A3A;--muted:#6F6A80;--line:#EADCC6;--tint:rgba(45,42,58,.045);--okbg:#DDF5E8;--ok:#188A55;--badbg:#FDE3E0;--bad:#D6453D;--warn:#B77A0A;--shadow:0 4px 0 rgba(45,42,58,.07),0 14px 26px rgba(45,42,58,.08);--soft:var(--c3);color-scheme:light}
:root[data-theme=dark]{--rk0:#6A6694;--g1:#4FA070;--g2:#2B6B4C;--cl:#A9A6D8;--cl2:#6E6BA8;--win:#FFD27A;--ff:1;--w1:#2B4A80;--w2:#1B2F5C;--sand:#9A8560;--sk1:#1B1F4A;--sk2:#3B3A7A;--sk3:#8A6FA8;--sunc:#F4F1D0;--rk:#4A4A78;--rk2:#2C2A50;--cl:#8E8BC0;--fg:#14152B;--stars:1;--bg:#1C1A2A;--bg2:#252238;--card:#2A2641;--ink:#F5F1FF;--muted:#B5AECD;--line:#3E3A5A;--tint:rgba(255,255,255,.06);--okbg:rgba(52,211,153,.17);--ok:#62E2A9;--badbg:rgba(248,113,113,.17);--bad:#FF918A;--warn:#F5C451;--shadow:0 4px 0 rgba(0,0,0,.25),0 14px 26px rgba(0,0,0,.25);--soft:color-mix(in srgb,var(--c1) 20%,transparent);color-scheme:dark}
:root{--ac:var(--c1);--ac2:var(--c2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Nunito","Plus Jakarta Sans",system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
svg{display:block}
#app{height:100%;display:flex;flex-direction:column;position:relative}
/* ---------- tombol ---------- */
.btn{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:9px 16px;font-weight:800;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:hover{border-color:var(--c1)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.pri{background:var(--c1);border-color:var(--c1d);color:#fff;box-shadow:0 4px 0 var(--c1d)}
.btn.pri:active{transform:translateY(4px);box-shadow:0 0 0 var(--c1d)}
.btn.sec{background:var(--c2);border-color:rgba(0,0,0,.18);color:#2D2A3A;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:12px;box-shadow:0 2px 0 var(--line)}
.btn.lg{padding:14px 24px;font-size:19px;border-radius:20px}
.btn[disabled]{opacity:.45;cursor:default}
.ib{width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--line);background:var(--card);border-radius:14px;box-shadow:0 3px 0 var(--line);font-size:19px;padding:0}
.ib:active{transform:translateY(3px);box-shadow:none}
/* ---------- loading ---------- */
#load{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;transition:opacity .5s,visibility .5s}
#load.out{opacity:0;visibility:hidden}
#load .mas{animation:bob 1.1s ease-in-out infinite}
#load h1{margin:0;font-size:clamp(28px,5vw,46px);font-weight:900;letter-spacing:.01em}
#load h1 span{color:var(--c1)}
#load .pb{width:min(360px,80vw);height:16px;border-radius:99px;background:var(--tint);border:2px solid var(--line);overflow:hidden}
#load .pb i{display:block;height:100%;width:0;background:var(--c1);border-radius:99px;transition:width .35s}
#load p{margin:0;color:var(--muted);font-weight:700;min-height:24px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes slide{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
/* ---------- bilah atas & peta tahap ---------- */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:0 0 auto}
.top .ttl{font-weight:900;font-size:18px;line-height:1.1}
.top .ttl small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.sp{flex:1}
.path{display:flex;align-items:flex-start;padding:4px 16px 10px;overflow-x:auto;flex:0 0 auto;scrollbar-width:none}
.path::-webkit-scrollbar{display:none}
.pn{flex:1 0 auto;min-width:78px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;background:none;border:0;padding:0;color:var(--muted);font-size:11.5px;font-weight:800;text-align:center}
.pn:not(:last-child)::after{content:"";position:absolute;top:19px;left:calc(50% + 22px);right:calc(-50% + 22px);height:5px;border-radius:9px;background:var(--line)}
.pn.done:not(:last-child)::after{background:var(--c1)}
.pn b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--card);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);position:relative;z-index:1}
.pn.done b{background:var(--c1);border-color:var(--c1d);box-shadow:0 3px 0 var(--c1d);color:#fff}
.pn.on b{background:var(--c2);border-color:rgba(0,0,0,.2);box-shadow:0 3px 0 rgba(0,0,0,.2),0 0 0 5px var(--soft);transform:scale(1.12);color:#2D2A3A}
.pn.on{color:var(--ink)}
.pn span{max-width:96px;line-height:1.15}
/* ---------- isi ---------- */
.main{flex:1;min-height:0;overflow:auto;padding:8px clamp(12px,3vw,32px) 22px;scroll-behavior:smooth}
.page{max-width:1180px;margin:0 auto;animation:slide .35s ease}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:4px 0 14px}
.head .tahap{width:100%;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c1);font-weight:900}
.head h2{margin:0;flex:1;min-width:240px;font-size:clamp(26px,3.6vw,42px);line-height:1.1;font-weight:900}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:clamp(14px,2vw,24px);margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--c1);font-weight:900}
.big{font-size:clamp(22px,3vw,36px);font-weight:900;line-height:1.3;margin:4px 0}
.txt{font-size:clamp(16px,1.8vw,22px);line-height:1.55;margin:0 0 8px}
.pts{margin:0;padding-left:1.25em;font-size:clamp(16px,1.8vw,21px);line-height:1.55}
.pts li{margin:5px 0}
.pts li::marker{color:var(--c1);font-weight:900}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.prof{border:2px solid var(--line);border-radius:18px;padding:14px;background:var(--soft)}
.prof h4{margin:0 0 6px;font-size:21px;font-weight:900}
.prof .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c1);font-weight:900;margin-top:8px}
.prof p{margin:2px 0;font-size:16px;line-height:1.45}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;font-weight:600;color:var(--ink);background:var(--tint);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--c1)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-weight:800;margin:10px 0 4px;font-size:13.5px;color:var(--muted)}
.tally{display:flex;flex-wrap:wrap;gap:10px}
.tally div{flex:1;min-width:130px;border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center;background:var(--soft);font-weight:800}
.tally b{display:block;font-size:34px;font-weight:900}
.tally button{margin:2px}
.obs{width:100%;border-collapse:separate;border-spacing:4px;font-size:15px}
.obs th{font-size:13px;color:var(--muted)}
.obs td,.obs th{padding:7px 8px;text-align:center;border-radius:10px}
.obs td:first-child,.obs th:first-child{text-align:left;font-weight:800}
.obs td.c{cursor:pointer;min-width:70px;font-weight:900;background:var(--tint)}
.obs .c.v1{background:var(--okbg);color:var(--ok)}
.obs .c.v2{background:rgba(251,191,36,.28);color:var(--warn)}
.turn{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.turn span{border:2px solid var(--line);border-radius:99px;padding:5px 15px;font-weight:800;color:var(--muted);background:var(--card)}
.turn span.on{background:var(--c1);border-color:var(--c1d);color:#fff}
.board{display:grid;gap:8px;margin-bottom:14px}
.row{display:grid;grid-template-columns:150px repeat(5,1fr);gap:6px;align-items:center}
.row .nm{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.me .nm{color:var(--c1)}
.slot{border:2px dashed var(--line);border-radius:12px;padding:6px 4px;text-align:center;font-size:12px;color:var(--muted);min-height:46px;display:grid;place-items:center;line-height:1.15;font-weight:800}
.slot.got{border-style:solid;background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.slot.cur{border-color:var(--c1);color:var(--ink);background:var(--soft)}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px 16px;margin:9px 0;font-size:clamp(16px,1.8vw,21px);line-height:1.4;font-weight:700;box-shadow:0 3px 0 var(--line)}
.opt:hover{border-color:var(--c1)}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.expl{border-left:6px solid var(--c1);padding:10px 16px;background:var(--soft);border-radius:12px;font-size:clamp(15px,1.7vw,20px);line-height:1.5;margin-top:10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:800;background:var(--card)}
.chip small{display:block;color:var(--muted);font-weight:700;font-size:11px}
.rank{display:grid;gap:8px}
.rank div{display:flex;justify-content:space-between;gap:10px;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--soft);font-weight:800}
.mact{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
/* ---------- bilah bawah ---------- */
.bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-top:2px solid var(--line)}
.bar .tmw{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 14px;border:2px solid var(--line);border-radius:18px;background:var(--tint)}
.tm{font-weight:900;font-size:26px;min-width:84px;text-align:center;font-variant-numeric:tabular-nums}
.tm.low{color:var(--bad)}
.bar .nx{min-width:150px}
.bar .lab{font-size:13px;color:var(--muted);font-weight:800}
/* ---------- menu & setup ---------- */
.menu{max-width:980px;margin:0 auto;text-align:center;animation:slide .4s ease}
.hero{border-radius:30px;overflow:hidden;border:2px solid var(--line);box-shadow:var(--shadow);position:relative;background:var(--soft)}
.hero svg.scene{width:100%;height:auto;max-height:46vh}
.hero .mas{position:absolute;left:var(--mx,29%);bottom:36%;animation:bob 2.2s ease-in-out infinite}
.menu h1{font-size:clamp(34px,6vw,60px);margin:16px 0 4px;font-weight:900;line-height:1}
.menu h1 span{color:var(--c1)}
.menu .sub{max-width:720px;margin:0 auto 14px;font-size:clamp(15px,1.8vw,19px);line-height:1.5;color:var(--muted);font-weight:700}
.menu .btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:14px 0}
.setup{max-width:760px;margin:0 auto;animation:slide .35s ease}
.setup h1{font-size:clamp(26px,4vw,40px);margin:6px 0 10px;font-weight:900}
.alur{padding-left:1.3em;line-height:1.9}
.alur span{color:var(--muted);margin-left:8px;font-size:13px}
/* ---------- splash tahap ---------- */
#splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;transition:opacity .35s}
#splash.out{opacity:0;pointer-events:none}
#splash .ic{width:130px;height:130px;border-radius:50%;background:var(--c2);display:grid;place-items:center;font-size:64px;border:5px solid rgba(0,0,0,.15);box-shadow:0 8px 0 rgba(0,0,0,.15);animation:pop .5s ease}
#splash .n{font-weight:900;letter-spacing:.12em;color:var(--c1);text-transform:uppercase;font-size:14px}
#splash h2{margin:0;font-size:clamp(28px,5vw,48px);font-weight:900;max-width:760px}
#splash p{margin:0;color:var(--muted);font-weight:800;font-size:18px}
/* ---------- modal ---------- */
.mod{position:fixed;inset:0;z-index:50;background:rgba(30,25,50,.55);display:flex;align-items:center;justify-content:center;padding:14px}
.mod .box{width:min(920px,100%);max-height:92vh;overflow:auto;background:var(--bg);border:2px solid var(--line);border-radius:26px;padding:22px;animation:pop .25s ease;box-shadow:var(--shadow)}
.mod h2{margin-top:0;font-weight:900}
.mod h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--c1);margin:18px 0 6px;font-weight:900}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:90;font-weight:800}
.tools{display:grid;gap:10px}
.tools .btn{text-align:left;font-size:17px;padding:14px 18px}
/* ---------- editor ---------- */
.etabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.etabs button{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-weight:800}
.etabs button.on{background:var(--c1);color:#fff;border-color:var(--c1d)}
.ebox{border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin:8px 0;background:var(--card)}
.ebox>summary{cursor:pointer;font-weight:900;padding:4px 0}
.eact{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.efs{border-left:4px solid var(--soft);padding-left:10px;margin:8px 0}
.efs>.et{font-weight:900;color:var(--c1);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
/* ---------- laporan ---------- */
.rep{background:#fff;color:#111;border-radius:12px;padding:22px;font-size:14px;line-height:1.5;font-weight:500}
.rep h1{font-size:20px;margin:0 0 4px}.rep h3{font-size:15px;margin:16px 0 6px;border-bottom:2px solid #ddd;padding-bottom:3px;color:#111;text-transform:none;letter-spacing:0}
.rep table{width:100%;border-collapse:collapse;margin:4px 0}.rep th,.rep td{border:1px solid #bbb;padding:5px 7px;text-align:left;vertical-align:top;font-size:13px}.rep th{background:#e8f0ff}
.rep .pre{white-space:pre-wrap}
@media(max-width:760px){.row{grid-template-columns:90px repeat(5,1fr)}.slot{font-size:10px}.pn span{display:none}.pn{min-width:56px}.bar .nx{min-width:0}}
@media print{
  body{overflow:visible;background:#fff}
  #app,.toast,#load,#splash{display:none!important}
  .mod{position:static;background:none;padding:0;display:block}
  .mod .box{max-height:none;overflow:visible;border:0;background:#fff;padding:0;width:100%;box-shadow:none}
  .mod .mact,.mod .noprint{display:none!important}
  .rep{padding:0;border-radius:0}
}
a.btn{color:var(--ink)}a.btn.pri{color:#fff}

html{--mx:29%}

.sc-gr{fill:color-mix(in srgb,var(--c1) 14%,#6FC768)}.sc-gr2{fill:color-mix(in srgb,var(--c1) 10%,#9ADB74)}
.sc-rock{fill:var(--rk)}.sc-rock2{fill:var(--rk2)}
.sc-tr{fill:color-mix(in srgb,var(--c1) 12%,#2E9A5B)}.sc-tr2{fill:color-mix(in srgb,var(--c1) 10%,#62C27A)}
.sc-cl{fill:var(--cl);opacity:.9}.sc-fg{fill:var(--fg)}
.sc-star{fill:#fff;opacity:var(--stars)}.sc-bird path{fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;opacity:.6}
.fl{animation:flt 7s ease-in-out infinite}.fl:nth-of-type(odd){animation-duration:9s}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.cl{animation:drift 40s linear infinite}
@keyframes drift{0%{transform:translateX(-40px)}50%{transform:translateX(40px)}100%{transform:translateX(-40px)}}
.wfall{animation:wfl 2.4s linear infinite;transform-box:fill-box}
@keyframes wfl{0%{opacity:.55}50%{opacity:.95}100%{opacity:.55}}

/* ---------- dunia pulau: loading, menu, peta tahap ---------- */
#load{padding:0;justify-content:flex-end;gap:0;overflow:hidden}
#load .lscene{position:absolute;inset:0}#load .lscene svg{width:100%;height:100%}
#load .lmas{position:absolute;left:50%;top:46%;margin-left:-80px;z-index:2}
#load .lbox{position:relative;z-index:3;margin:0 auto 7vh;padding:18px 30px 16px;border-radius:28px;background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(8px);border:2px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:10px;width:min(460px,88vw)}
.hero svg.scene{width:100%;height:auto;max-height:52vh;aspect-ratio:800/440}
.path{background:linear-gradient(var(--w1),var(--w2));border:2px solid var(--line);border-radius:22px;margin:2px clamp(10px,2vw,26px) 8px;padding:32px 14px 8px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.pn{color:#fff}.pn span{text-shadow:0 1px 3px rgba(0,0,0,.45);color:#fff}
.pn:not(:last-child)::after{top:36px;height:0;background:none!important;border-top:4px dotted rgba(255,255,255,.85);border-radius:0}
.pn.done:not(:last-child)::after{border-top-color:#fff;border-top-style:solid}
.pn b{width:52px;height:38px;border-radius:50%/60%;background:color-mix(in srgb,var(--c1) 55%,#8FD16C);border:4px solid var(--sand);box-shadow:0 5px 0 rgba(0,0,0,.18);color:#fff;font-size:18px}
.pn.done b{background:color-mix(in srgb,var(--c1) 70%,#2E8B57);border-color:var(--sand);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.pn.on b{background:var(--c2);border-color:#fff;transform:scale(1.18);box-shadow:0 6px 0 rgba(0,0,0,.2),0 0 0 6px rgba(255,255,255,.35);color:#2D2A3A}
.pn.on::before{content:"📍";position:absolute;top:-19px;left:50%;margin-left:-10px;font-size:20px;animation:bob 1.2s ease-in-out infinite;z-index:2}
.pn:not(.done):not(.on) b{filter:saturate(.45) brightness(.95);opacity:.85}
.pn:not(.on) span{opacity:.9}
html[data-theme=dark] .sc-gr{fill:color-mix(in srgb,var(--c1) 20%,#2F7A55)}html[data-theme=dark] .sc-gr2{fill:color-mix(in srgb,var(--c1) 16%,#3E8E62)}html[data-theme=dark] .sc-tr{fill:color-mix(in srgb,var(--c1) 14%,#1C5A3E)}html[data-theme=dark] .sc-tr2{fill:color-mix(in srgb,var(--c1) 14%,#2E7A55)}

#ansT{display:flex;align-items:center;gap:10px;margin:6px 0 10px;font-weight:900}
#ansT:empty{display:none}
.ansbar{flex:1;height:12px;border-radius:99px;background:var(--tint);border:2px solid var(--line);overflow:hidden}
.ansbar i{display:block;height:100%;background:var(--c1);border-radius:99px;transition:width 1s linear}
#ansT.low .ansbar i{background:var(--bad)}#ansT.low b{color:var(--bad)}

    if(RULES.mundurLebih){const back=200-raw;await walkTo(i,100);addLog(`↩️ Kelebihan ${raw-100} langkah, kembali ke kotak ${back}`);paint();await sleep2(500);await walkTo(i,back)}

}

function repl(dst,src){
  if(Array.isArray(dst)&&Array.isArray(src)){dst.splice(0,dst.length,...JSON.parse(JSON.stringify(src)));return true}
  if(dst&&src&&typeof dst==="object"&&typeof src==="object"&&!Array.isArray(dst)){Object.keys(dst).forEach(k=>delete dst[k]);Object.assign(dst,JSON.parse(JSON.stringify(src)));return true}
  return false;
}
function applyConf(c){
  if(!c||typeof c!=="object")return;
  try{
    if(c.RPL)repl(RPL,Object.assign({},DEF.RPL,c.RPL));
    if(Array.isArray(c.FASE)&&c.FASE.length===DEF.FASE.length)repl(FASE,c.FASE);
    if(Array.isArray(c.FIELDS)&&c.FIELDS.length===DEF.FIELDS.length)repl(FIELDS,c.FIELDS);
    if(c.DATA&&typeof GAMEDATA==="object")Object.keys(GAMEDATA).forEach(k=>{if(c.DATA[k]===undefined)return;const d=GAMEDATA[k];if(d&&!Array.isArray(d)&&typeof c.DATA[k]==="object"&&!Array.isArray(c.DATA[k]))repl(d,Object.assign({},DEF.DATA[k],c.DATA[k]));else repl(d,c.DATA[k])});
  }catch(e){console.warn("conf",e)}
}

  ${A.bagian.map((b,i)=>`<div class="ebox"><label class="f">Nama bagian</label><input type="text" data-bg="${i}|j" maxlength="60" value="${esc(b.j)}">
   <label class="f">Bentuk</label><select data-bg="${i}|tipe">${[["teks","Paragraf"],["poin","Daftar poin"],["nomor","Daftar nomor"]].map(o=>`<option value="${o[0]}" ${b.tipe===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select>
   <label class="f">Isi (satu butir per baris untuk daftar)</label><textarea data-bg="${i}|isi" maxlength="1500">${esc(b.isi)}</textarea>
   <div class="eact"><button class="btn sm" data-bga="up|${i}" ${i===0?"disabled":""}>↑</button><button class="btn sm" data-bga="dn|${i}" ${i===A.bagian.length-1?"disabled":""}>↓</button><button class="btn sm" data-bga="del|${i}">Hapus</button></div></div>`).join("")}
  ${A.bagian.length<10?'<button class="btn sm" data-bga="add|0">+ Tambah bagian</button>':""}`;
  }else if(t==="RULES"){
    const gi=FASE.findIndex(f=>f.tipe==="game"),R=ED.conf.DATA.RULES||{},LB=typeof RULE_LBL==="object"?RULE_LBL:{};
    body=`<p class="txt" style="font-size:15px;color:var(--muted)">Atur jalannya permainan. Nilai 0 pada batas waktu berarti tanpa batas.</p>
     ${gi>=0?`<div class="rl"><label>Durasi tahap permainan (menit)</label><input type="number" data-ep="FASE.${gi}.menit" data-num="1" min="1" value="${ED.conf.FASE[gi].menit}"></div>`:""}
     ${Object.keys(R).map(k=>`<div class="rl"><label>${esc((LB[k]&&LB[k].l)||k)}</label><input type="number" data-ep="DATA.RULES.${k}" data-num="1" min="0" value="${R[k]}"></div>`).join("")||'<p class="txt">Game ini tidak punya aturan tambahan.</p>'}`;
  }else{
    const v=t==="DATA"?ED.conf.DATA:ED.conf[t];
    body=(t==="FASE"?`<p class="txt" style="font-size:15px;color:var(--muted)">Urutan dan jenis tahap tetap. Isi kartu, judul, dan durasi bisa diubah. Kartu bisa ditambah atau dihapus.</p>`:"")+
      (t==="DATA"&&!Object.keys(v).filter(k=>k!=="RULES").length?`<p class="txt">Game ini tidak memiliki data tambahan.</p>`:"")+
      (t==="DATA"?Object.keys(v).filter(k=>k!=="RULES").map(k=>edNode("DATA."+k,v[k],k,v)).join(""):edNode(t,v,"",null));
  }
  return `<h2>✎ Edit isi game</h2><p class="txt" style="color:var(--muted);font-size:14px">Perubahan disimpan ke server dengan password admin Speganam, lalu dipakai di semua perangkat. Sesi yang sedang berjalan sebaiknya dimulai ulang setelah mengubah soal.</p>
  <div class="etabs">${ETABS.map(x=>`<button data-et="${x[0]}" class="${t===x[0]?"on":""}">${x[1]}</button>`).join("")}</div>${body}
  <div class="mact"><button class="btn" id="edReset">↺ Kembalikan bawaan</button><button class="btn" data-v="cancel">Batal</button><button class="btn pri" id="edSave">💾 Simpan</button></div>`;
}
function edRender(){const y=$("#mbox").scrollTop,o=[...document.querySelectorAll("#mbox details")].map(d=>d.open);$("#mbox").innerHTML=edHtml();[...document.querySelectorAll("#mbox details")].forEach((d,i)=>{if(o[i]!=null)d.open=o[i]});$("#mbox").scrollTop=y}
function openEditor(){
  ED={tab:"info",info:JSON.parse(JSON.stringify(INFO)),conf:currentConf()};
  $("#mbox").innerHTML=edHtml();$("#mod").classList.remove("hidden");
  $("#mbox").onclick=async e=>{
    const et=e.target.closest("[data-et]");if(et){ED.tab=et.dataset.et;edRender();return}
    const ba=e.target.closest("[data-bga]");
    if(ba){const[a,i]=ba.dataset.bga.split("|"),n=+i,B=ED.info.bagian;
      if(a==="add")B.push({j:"",tipe:"teks",isi:""});else if(a==="del")B.splice(n,1);else if(a==="up"&&n>0)[B[n-1],B[n]]=[B[n],B[n-1]];else if(a==="dn"&&n<B.length-1)[B[n+1],B[n]]=[B[n],B[n+1]];
      edRender();return}
    const ea=e.target.closest("[data-ea]");
    if(ea){const[a,p,i]=ea.dataset.ea.split("|"),n=+i;const root=p.startsWith("DATA")?ED.conf:ED.conf;const arr=getp(root,p);
      if(a==="add"){arr.push(blank(arr.length?arr[arr.length-1]:""))}else if(a==="del"){if(arr.length>1||!p.startsWith("RPL.")||true)arr.splice(n,1)}else if(a==="up"&&n>0)[arr[n-1],arr[n]]=[arr[n],arr[n-1]];else if(a==="dn"&&n<arr.length-1)[arr[n+1],arr[n]]=[arr[n],arr[n+1]];
      edRender();return}
    if(e.target.id==="edReset"){if(confirm("Kembalikan semua isi ke bawaan? (belum disimpan sampai Anda menekan Simpan)")){ED.conf=JSON.parse(JSON.stringify(Object.assign({v:1},DEF)));edRender()}return}
    if(e.target.id==="edSave"){await edSave();return}
    if(e.target.closest('[data-v="cancel"]')){$("#mod").classList.add("hidden");openInfo()}
  };
  const inp=e=>{
    const t=e.target,k=t.dataset.e;
    if(k){ED.info[k]=(k==="capaian"||k==="tujuan")?t.value.split("\n"):t.value;return}
    const g=t.dataset.bg;if(g){const[i,f]=g.split("|");ED.info.bagian[+i][f]=t.value;return}
    const p=t.dataset.ep;if(p){const v=t.dataset.list?t.value.split(/[,\s]+/).map(Number).filter(x=>Number.isFinite(x)&&x>0):t.dataset.num?(parseFloat(t.value)||0):t.value;setp(ED.conf,p,v);if(e.type==="change"&&t.tagName==="SELECT"){}}
  };
  $("#mbox").oninput=inp;$("#mbox").onchange=inp;
}
async function edSave(){
  const info=cleanAbout(ED.info),b=$("#edSave");b.disabled=true;
  try{
    try{localStorage.setItem(BG_LS,JSON.stringify(info.bagian))}catch(e){}
    const back=cleanAbout(await GK.info.save(ABOUT_ID,info));
    INFO=withBg(back);
    const c=ED.conf;
    try{localStorage.setItem(CONF_LS,JSON.stringify(c))}catch(e){}
    let ok=true;try{await GK.conf.save(ID,c)}catch(e){ok=false;if(e&&e.code==="CANCEL")throw e;toast("Isi game tersimpan di perangkat ini saja: "+(e&&e.message||"server belum siap"))}
    applyConf(c);if(S){S.g=null;save()}
    if(ok)toast("Tersimpan");
    $("#mod").classList.add("hidden");
    if($("#ttl"))$("#ttl").innerHTML=esc(NAMA)+"<small>"+esc(RPL.judul)+"</small>";
    if(S&&S.setup&&!$("#bar").classList.contains("hidden")){tmReset(FASE[S.i]);renderSesi()}else renderMenu();
  }catch(e){
    b.disabled=false;
    toast(e&&e.code==="CANCEL"?"Belum tersimpan (password dibatalkan)":"Gagal menyimpan: "+(e&&e.message||"galat"));
  }
}
function cardsHtml(cs){return (cs||[]).map(c=>`<div class="card">${c.h?`<h3>${esc(c.h)}</h3>`:""}${c.p?`<p class="txt">${esc(c.p)}</p>`:""}${c.big?`<div class="big">${safeBig(c.big)}</div>`:""}${c.ol&&c.ol.length?`<ol class="pts">${li(c.ol)}</ol>`:""}${c.ul&&c.ul.length?`<ul class="pts">${li(c.ul)}</ul>`:""}${c.grid&&c.grid.length?`<div class="grid">${c.grid.map(g=>`<div class="prof"><h4>${esc(g.h)}</h4>${g.rows.map(r=>`<div class="k">${esc(r[0])}</div><p>${esc(r[1])}</p>`).join("")}</div>`).join("")}</div>`:""}${c.foot?`<p class="txt" style="margin-top:10px;color:var(--muted);font-size:15px">${esc(c.foot)}</p>`:""}</div>`).join("")}

function tglIni(){return new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}
function showReport(){
  const M=(kind,ind)=>`<table><tr><th>Kelompok</th>${ind.map(x=>`<th>${esc(x)}</th>`).join("")}</tr>${S.names.map((n,i)=>`<tr><td>${esc(n)}</td>${ind.map((_,j)=>`<td>${OBS[((S[kind][i]||[])[j])||0]}</td>`).join("")}</tr>`).join("")}</table>`;
  const gr=gameRows();
  modal(`<div class="rep"><h1>Laporan Layanan Bimbingan Klasikal</h1><div>${esc(RPL.judul)} · Kelas ${esc(S.kelas||"-")} · ${tglIni()}</div>
  <h3>Ringkasan</h3><table>${Object.keys(RPL.meta).map(k=>`<tr><td style="width:30%">${esc(k)}</td><td>${esc(RPL.meta[k])}</td></tr>`).join("")}<tr><td>Kelompok</td><td>${esc(S.names.join(", "))}</td></tr></table>
  <h3>Asesmen awal (pertanyaan pemantik)</h3><div><i>${esc(RPL.pemantik)}</i></div>${RPL.tally?`<div>Sebaran pilihan: ${RPL.tally.map(k=>esc(k)+" "+(S.tally[k]||0)).join(" · ")}</div>`:""}<div class="pre">${esc(S.notes.awal||"")}</div>
  <h3>Observasi proses</h3>${M("obs",RPL.indProses)}
  <h3>Asesmen hasil</h3>${M("hasil",RPL.indHasil)}<div class="pre">${esc(S.notes.akhir||"")}</div>
  <h3>${esc(RPL.rencanaJ)} per kelompok</h3><table><tr><th>Kelompok</th>${FIELDS.map(f=>`<th>${esc(f.l)}</th>`).join("")}</tr>${S.names.map((n,i)=>`<tr><td>${esc(n)}</td>${FIELDS.map(f=>`<td class="pre">${esc((S.plans[i]||{})[f.k]||"")}</td>`).join("")}</tr>`).join("")}</table>
  <h3>Hasil permainan</h3>${gr.length?`<table><tr>${GAME_COLS.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${gr.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</table>`:"<div>Permainan belum dimainkan.</div>"}
  <h3>Catatan guru</h3>${FASE.filter(f=>S.notes[f.id]).map(f=>`<div><b>${esc(f.judul)}</b><div class="pre">${esc(S.notes[f.id])}</div></div>`).join("")||"<div>-</div>"}
  <p style="margin-top:14px;font-size:12px;color:#555">Dibuat oleh Guru BK SMP Negeri 36 Semarang. Data tersimpan di perangkat guru dan tidak memuat nama murid.</p></div>
  <div class="mact noprint"><button class="btn" data-v="x">Tutup</button><button class="btn pri" id="bPrint">🖨 Cetak / Simpan PDF</button></div>`);
  $("#bPrint").onclick=()=>window.print();
}
function unduhXlsx(){
  const gr=gameRows(),tgl=tglIni();
  const Mx=(kind,ind)=>[["Kelompok",...ind],...S.names.map((n,i)=>[n,...ind.map((_,j)=>OBS[((S[kind][i]||[])[j])||0])])];
  const sheets=[
   {name:"Ringkasan",w:[28,70],head:-1,rows:[["RPL Bimbingan Klasikal",RPL.judul],...Object.keys(RPL.meta).map(k=>[k,RPL.meta[k]]),["Kelas",S.kelas||""],["Tanggal",tgl],["Kelompok",S.names.join(", ")],["Catatan","Data hanya tersimpan di perangkat guru. Tidak memuat nama murid."]]},
   {name:"Asesmen Awal",w:[40,80],head:0,rows:[["Pertanyaan pemantik","Catatan guru"],[RPL.pemantik,(RPL.tally?"Sebaran: "+RPL.tally.map(k=>k+" "+(S.tally[k]||0)).join(", ")+"\n":"")+(S.notes.awal||"")]]},
   {name:"Observasi Proses",w:[22,24,24,24,24],head:0,rows:Mx("obs",RPL.indProses)},
   {name:"Asesmen Akhir",w:[22,40,40,40],head:0,rows:[...Mx("hasil",RPL.indHasil),[],["Catatan observasi",S.notes.akhir||""]]},
   {name:"Rencana Kelompok",w:[22,...FIELDS.map(()=>38)],head:0,rows:[["Kelompok",...FIELDS.map(f=>f.l)],...S.names.map((n,i)=>[n,...FIELDS.map(f=>(S.plans[i]||{})[f.k]||"")])]},
   {name:"Hasil Permainan",w:GAME_COLS.map((_,i)=>i?16:24),head:0,rows:gr.length?[GAME_COLS,...gr]:[["Permainan belum dimainkan"]]},
   {name:"Catatan Guru",w:[40,90],head:0,rows:[["Fase","Catatan"],...FASE.filter(f=>S.notes[f.id]).map(f=>[f.judul,S.notes[f.id]])]}
  ];
  const blob=buildXlsx(sheets),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=`RPL-${ID}${S.kelas?"-"+S.kelas.replace(/[^\w-]+/g,""):""}-${new Date().toISOString().slice(0,10)}.xlsx`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Berkas Excel diunduh");
}

$("#ttl").innerHTML=esc(NAMA)+"<small>"+esc(RPL.judul)+"</small>";
boot();
</script>
