  <style>
    /* Kartu ramping: hanya gambar + judul + tombol. Deskripsi & tag pindah ke jendela Info. */
    .gbk-body { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0.6rem; padding: 0.9rem 1.2rem 1rem; }
    .gbk-body h2 { font-size: 1.2rem; }
    .gbk-play { margin-top: 0; justify-self: end; white-space: nowrap; }
    .gbk-soon .gbk-body { grid-template-columns: 1fr; }
    .gbk-grid > li { grid-template-rows: 1fr auto; }
    .gbk-grid > li > .gbk-card { grid-template-rows: auto 1fr; height: 100%; }
    button.gbk-about { font: inherit; font-size: 0.82rem; font-weight: 700; cursor: pointer; }
    .gbk-ov { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(5, 8, 22, 0.55); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
    .gbk-ov[hidden] { display: none; }
    .gbk-dlg { position: relative; width: min(30rem, 100%); max-height: 90vh; overflow: auto; display: grid; gap: 0.75rem; padding: 1.4rem 1.4rem 1.3rem; border: 1px solid var(--line); border-radius: 1.4rem; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-up); }
    .gbk-dlg h3 { margin: 0; padding-right: 2.2rem; font-size: 1.3rem; letter-spacing: -0.02em; line-height: 1.15; }
    .gbk-dlg .gbk-lbl { justify-self: start; padding: 0.12rem 0.7rem; border-radius: 99px; background: var(--tint); font-size: 0.74rem; font-weight: 700; }
    .gbk-dlg p { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.55; }
    .gbk-dlg .gbk-x { position: absolute; top: 0.8rem; right: 0.8rem; width: 2.2rem; height: 2.2rem; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--ink); font-size: 1.1rem; line-height: 1; cursor: pointer; }
    .gbk-dlg .gbk-x:hover { border-color: var(--accent); color: var(--accent); }
    .gbk-dlg .gbk-act { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.2rem; }
    .gbk-dlg .gbk-act .gbk-play { margin: 0; text-decoration: none; }
    .gbk-dlg .gbk-act .gbk-about { align-self: center; }
    @media (max-width: 420px) { .gbk-body { grid-template-columns: 1fr; } .gbk-play { justify-self: start; } }
    /* Tampilan daftar (list) */
    ul.gbk-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
    .gbk-row{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;align-items:center;gap:.4rem .8rem;padding:.7rem .9rem;border:1px solid var(--line);border-radius:1rem;background:var(--surface);color:var(--ink)}
    .gbk-row .no{font-weight:800;color:var(--muted);text-align:center}
    .gbk-row .tt{min-width:0}
    .gbk-row .tt b{display:block;font-size:1rem;line-height:1.25}
    .gbk-row .tt small{display:block;color:var(--muted);font-size:.82rem;margin-top:.1rem}
    .gbk-row .tt small em{font-style:normal;font-weight:700;color:var(--accent)}
    .gbk-row .ac{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .gbk-row .gbk-play{margin:0;text-decoration:none;white-space:nowrap}
    .gbk-row.soon{opacity:.6}
    .gbk-row.soon .tt small{font-style:italic}
    @media(max-width:520px){.gbk-row{grid-template-columns:1.6rem 1fr}.gbk-row .ac{grid-column:2;justify-content:flex-start}}

    /* ===== Gaya stiker serasi maskot (garis navy tebal, navy–kuning–krem) ===== */
    :root,:root[data-theme=light]{--ol:#1E2A5C;--sb:#FFF4DE;--sc:#fff;--si:#1E2A5C;--sm:#5C6593;--sy:#FFD23F}
    :root[data-theme=dark]{--ol:#070A22;--sb:#1A1F4D;--sc:#2A3170;--si:#F6F2FF;--sm:#B9BFEA;--sy:#FFD23F}
    body{background:radial-gradient(circle at 2px 2px,rgba(30,42,92,.11) 1.6px,transparent 1.8px) 0 0/24px 24px,var(--sb)!important;color:var(--si)!important;font-family:"Nunito","Plus Jakarta Sans",system-ui,sans-serif}
    :root[data-theme=dark] body{background:radial-gradient(circle at 2px 2px,rgba(255,255,255,.06) 1.6px,transparent 1.8px) 0 0/24px 24px,var(--sb)!important}
    .gbk-head{display:grid!important;grid-template-columns:auto 1fr;align-items:center;gap:.4rem 1.2rem;padding:1.1rem 1.4rem;margin:.6rem 0 1.2rem;border:4px solid var(--ol);border-radius:28px;background:var(--sc);box-shadow:0 7px 0 var(--ol);position:relative}
    .gbk-head h1{margin:0;font-size:clamp(2rem,5vw,3.1rem);font-weight:900;letter-spacing:-.02em;color:var(--si);text-shadow:0 4px 0 rgba(30,42,92,.12);grid-column:2}
    .gbk-head .rich{grid-column:2;color:var(--sm)!important;font-weight:700;font-size:1.02rem}
    .gbk-head .gbk-cat{grid-column:1;grid-row:1/3;filter:drop-shadow(0 4px 0 rgba(30,42,92,.22));animation:gbkSway 2.6s ease-in-out infinite;transform-origin:50% 100%}
    @keyframes gbkSway{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-4px)}}
    ul.gbk-list{gap:.8rem}
    .gbk-row{grid-template-columns:2.6rem minmax(0,1fr) auto!important}
    .gbk-head h1{align-self:end}.gbk-head .rich{align-self:start}
    .gbk-row{border:3px solid var(--ol)!important;border-radius:20px!important;background:var(--sc)!important;color:var(--si)!important;box-shadow:0 5px 0 var(--ol);padding:.8rem 1rem;transition:transform .1s,box-shadow .1s}
    .gbk-row:not(.soon):hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ol)}
    .gbk-row .no{width:2.4rem;height:2.4rem;display:grid;place-items:center;border:3px solid var(--ol);border-radius:50%;background:var(--ac,var(--sy));color:#fff;font-weight:900;box-shadow:0 3px 0 var(--ol);text-shadow:0 1px 0 rgba(0,0,0,.3)}
    .gbk-row.soon{opacity:1;border-style:dashed!important;box-shadow:none;background:transparent!important}
    .gbk-row.soon .no{background:var(--sb);color:var(--sm);box-shadow:none;border-style:dashed;text-shadow:none}
    .gbk-row.soon .tt b{color:var(--sm)}
    .gbk-row .tt b{font-weight:900;font-size:1.08rem;color:var(--si)}
    .gbk-row .tt small{color:var(--sm)!important;font-weight:700}
    .gbk-row .tt small em{color:var(--ac,var(--si))!important;font-weight:900}
    .gbk-play,button.gbk-about{border:3px solid var(--ol)!important;border-radius:14px!important;font-weight:900!important;box-shadow:0 3px 0 var(--ol);cursor:pointer;padding:.45rem .9rem!important}
    .gbk-play{background:var(--ac,#3BA776)!important;color:#fff!important;text-shadow:0 1px 0 rgba(0,0,0,.28)}
    button.gbk-about,.gbk-about{background:var(--sc)!important;color:var(--si)!important}
    .gbk-play:active,button.gbk-about:active{transform:translateY(3px);box-shadow:none}
    .gbk-dlg{border:4px solid var(--ol)!important;border-radius:28px!important;background:var(--sc)!important;color:var(--si)!important;box-shadow:0 8px 0 var(--ol)!important}
    .gbk-dlg p{color:var(--sm)!important;font-weight:600}
    .gbk-dlg .gbk-lbl{background:var(--sy)!important;color:#1E2A5C;border:2px solid var(--ol);font-weight:800}
    .gbk-dlg .gbk-x{border:3px solid var(--ol)!important;box-shadow:0 3px 0 var(--ol)}
    .gbk-dlg .gbk-tags span{border:2px solid var(--ol);border-radius:99px;padding:.1rem .6rem;font-weight:800;font-size:.78rem}
    .gbk-credit{color:var(--sm)!important;font-weight:700}
    @media(max-width:520px){.gbk-head{grid-template-columns:1fr}.gbk-head h1,.gbk-head .rich{grid-column:1}.gbk-head .gbk-cat{grid-column:1;grid-row:auto;justify-self:center}}

    /* ===== Rata tengah & lebar seragam ===== */
    main.wrap{width:100%!important;max-width:860px!important;margin-left:auto!important;margin-right:auto!important;padding-left:16px!important;padding-right:16px!important;box-sizing:border-box}
    .gbk-head,ul.gbk-list,.gbk-credit{width:100%!important;max-width:none!important;box-sizing:border-box;margin-left:0!important;margin-right:0!important}
    .gbk-head{display:flex!important;flex-direction:column;align-items:center;text-align:center;gap:.3rem;padding:1rem 1.2rem 1.3rem}
    .gbk-head::before,.gbk-head::after,.gbk-head h1::before,.gbk-head h1::after,.gbk-head .rich::before{display:none!important;content:none!important}
    .gbk-head .gbk-cat{margin-bottom:.2rem}
    .gbk-head h1,.gbk-head .rich{grid-column:auto;align-self:auto;text-align:center;max-width:36rem}
    .gbk-credit{text-align:center}
    @media(max-width:520px){.gbk-head .gbk-cat{height:150px!important;width:auto!important}main.wrap{padding-left:12px!important;padding-right:12px!important}.gbk-row{padding:.7rem .75rem}.gbk-play,button.gbk-about{padding:.4rem .7rem!important}}
  </style>
  <style>
    /* Atur folder (gaya stiker serasi) */
    .gbk-folder .no{font-size:1.25rem}
    .gbk-empty{list-style:none;text-align:center;padding:1.4rem;border:3px dashed var(--ol);border-radius:20px;color:var(--sm);font-weight:800}
    .gbk-tools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:0 0 .9rem;padding:.6rem .8rem;border:3px dashed var(--ol);border-radius:18px;background:var(--sc)}
    .gbk-tools[hidden]{display:none}
    .gbk-tl{font-weight:900;color:var(--si);margin-right:auto}
    .gbk-row .gbk-ctl{grid-column:2/4;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
    .gbk-mini{min-width:2.4rem;height:2.4rem;border:3px solid var(--ol);border-radius:12px;background:var(--sc);color:var(--si);font:inherit;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--ol)}
    .gbk-mini:disabled{opacity:.4;cursor:default;box-shadow:none}
    .gbk-mini:active:not(:disabled){transform:translateY(3px);box-shadow:none}
    .gbk-sel{max-width:100%;height:2.4rem;border:3px solid var(--ol);border-radius:12px;background:var(--sc);color:var(--si);font:inherit;font-weight:800;padding:0 .5rem}
    .gbk-in{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;padding:.6rem .8rem;border:3px solid var(--ol);border-radius:12px;background:var(--sc);color:var(--si)}
    .gbk-msg{min-height:1.2em;color:#D9453D!important;font-weight:800}
    .gbk-toast{position:fixed;left:50%;bottom:5.5rem;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:500;max-width:min(92vw,26rem);padding:.7rem 1rem;border:3px solid var(--ol);border-radius:14px;background:#3BA776;color:#fff;font-weight:900;transition:.25s}
    .gbk-toast.bad{background:#D9453D}
    .gbk-toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:520px){.gbk-row .gbk-ctl{grid-column:1/3}}
    /* Akun, pemilih tampilan, ikon folder berwarna */
    #acctBtn{margin-left:auto;position:relative}
    .topbar .home-btn+#acctBtn,.topbar #acctBtn+#themeBtn{margin-left:.15rem}
    #acctBtn.on::after{content:"";position:absolute;right:.35rem;top:.35rem;width:.55rem;height:.55rem;border-radius:50%;background:#3BA776;border:2px solid var(--surface,#fff)}
    .gbk-views{display:flex;gap:.6rem;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:0 0 .8rem}
    .gbk-vg{display:flex;gap:.4rem;margin-left:auto}
    .gbk-vl{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;min-width:0;font-weight:800;font-size:.92rem;color:var(--sm)}
    .gbk-vl b{color:var(--si)}
    .gbk-cr{color:var(--sm);text-decoration:none;font-weight:800}
    .gbk-cr:hover{color:var(--si);text-decoration:underline}
    .gbk-sp{opacity:.6}
    .gbk-views[hidden]{display:none}
    .gbk-vb{display:inline-flex;align-items:center;gap:.35rem;height:2.3rem;padding:0 .8rem;border:3px solid var(--ol);border-radius:12px;background:var(--sc);color:var(--si);font:inherit;font-size:.82rem;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--ol)}
    .gbk-vb svg{width:1.05rem;height:1.05rem}
    .gbk-vb[aria-pressed=true]{background:var(--sy);color:#2b2200}
    .gbk-vb:active{transform:translateY(3px);box-shadow:none}
    @media(max-width:420px){.gbk-vb span{display:none}.gbk-vb{padding:0 .7rem}}
    .gbk-folder .no svg{width:58%;height:58%}
    ul.v-grid{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));gap:.9rem}
    ul.v-grid .gbk-row{grid-template-columns:1fr!important;align-content:start;gap:.55rem}
    ul.v-grid .gbk-row .no{width:3.2rem;height:3.2rem;border-radius:16px;font-size:1.25rem}
    ul.v-grid .gbk-row .ac{justify-content:flex-start}
    ul.v-compact{gap:.45rem!important}
    ul.v-compact .gbk-row{padding:.35rem .7rem!important;border-radius:14px!important;box-shadow:0 3px 0 var(--ol)!important;grid-template-columns:2rem minmax(0,1fr) auto!important}
    ul.v-compact .gbk-row .no{width:1.9rem;height:1.9rem;font-size:.85rem}
    ul.v-compact .gbk-row .tt b{font-size:.95rem}
    ul.v-compact .gbk-row .tt small{display:none}
    ul.v-compact .gbk-row .gbk-about{display:none}
    .gbk-pick{display:grid;gap:.5rem}
    .gbk-prev{width:3.4rem;height:3.4rem;border:3px solid var(--ol);border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:0 3px 0 var(--ol)}
    .gbk-prev svg{width:60%;height:60%}
    .gbk-lb2{font-weight:900;font-size:.85rem;color:var(--sm)}
    .gbk-sws,.gbk-ics{display:flex;flex-wrap:wrap;gap:.4rem}
    .gbk-sw{width:2.1rem;height:2.1rem;border-radius:50%;border:3px solid var(--ol);cursor:pointer}
    .gbk-sw[aria-pressed=true]{outline:4px solid var(--sy);outline-offset:1px}
    .gbk-ic{width:2.3rem;height:2.3rem;border:3px solid var(--ol);border-radius:10px;background:var(--sc);color:var(--si);display:grid;place-items:center;cursor:pointer;padding:0}
    .gbk-ic svg{width:1.15rem;height:1.15rem}
    .gbk-ic[aria-pressed=true]{background:var(--sy);color:#2b2200}
  </style>
  <style>
    /* Latar gradasi lembut seperti situs Speganam */
    :root{--bgm:#f3f6fd;--mesh:radial-gradient(52rem 40rem at 6% 28%,rgba(112,156,255,.46),transparent 62%),radial-gradient(44rem 34rem at 96% 8%,rgba(96,214,205,.34),transparent 62%),radial-gradient(48rem 36rem at 92% 92%,rgba(255,184,112,.46),transparent 62%),radial-gradient(40rem 26rem at 38% 104%,rgba(255,220,120,.28),transparent 62%)}
    :root[data-theme=dark]{--bgm:#080e1d;--mesh:radial-gradient(52rem 40rem at 6% 28%,rgba(52,96,232,.42),transparent 62%),radial-gradient(44rem 34rem at 96% 8%,rgba(24,170,168,.26),transparent 62%),radial-gradient(48rem 36rem at 92% 92%,rgba(255,160,56,.2),transparent 62%),radial-gradient(40rem 26rem at 38% 104%,rgba(255,200,80,.12),transparent 62%)}
    html:root body,html:root[data-theme] body{background:var(--bgm)!important;isolation:isolate}

  </style>

              sw.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === pick.c ? 'true' : 'false'); });
              ic.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === pick.i ? 'true' : 'false'); });
            }
            COLORS.forEach(function (c) { var b = el('button', 'gbk-sw'); b.type = 'button'; b.dataset.v = c; b.style.background = c; b.setAttribute('aria-label', 'Warna ' + c); b.onclick = function () { pick.c = c; paint(); }; sw.append(b); });
            ICONS.forEach(function (n) { var b = el('button', 'gbk-ic'); b.type = 'button'; b.dataset.v = n; b.setAttribute('aria-label', 'Ikon ' + n); b.append(App.svg(n)); b.onclick = function () { pick.i = n; paint(); }; ic.append(b); });
            w.append(pv, el('div', 'gbk-lb2', 'Warna'), sw, el('div', 'gbk-lb2', 'Ikon'), ic); paint(); return w;
          },
          collect: function (name) { return { j: name, c: pick.c, i: pick.i }; }
        });
      }
      function toast(t, bad) {
        var n = $('gbkToast'); if (!n) { n = el('div', 'gbk-toast'); n.id = 'gbkToast'; n.setAttribute('role', 'status'); document.body.append(n); }
        n.textContent = t; n.className = 'gbk-toast show' + (bad ? ' bad' : ''); clearTimeout(n._t); n._t = setTimeout(function () { n.className = 'gbk-toast'; }, 3200);
      }

      /* ---- Gambar daftar ---- */
      function cur() { return st.edit ? st.work : layout; }
      function merged(g) { var L = cur(), m = L && L.m && L.m[g.href]; return m ? Object.assign({}, g, m) : g; }
      function gameRow(g, no, ctl) {
        g = merged(g);
        var li = el('li', 'gbk-row'); if (WARNA[g.href]) li.style.setProperty('--ac', WARNA[g.href]);
        var t = el('div', 'tt'); t.append(el('b', '', g.layanan || g.judul));
        var sm = el('small'), em = el('em', '', g.judul); if (g.layanan) sm.append(em, document.createTextNode(' · ' + g.label)); else sm.append(el('em', '', 'Umum'), document.createTextNode(' · ' + g.label)); t.append(sm);
        var ac = el('div', 'ac');

        }

      }
      function folderRow(f, L, ctl) {
        var li = el('li', 'gbk-row gbk-folder'); li.style.setProperty('--ac', f.c || '#F2A93B');
        var t = el('div', 'tt'); t.append(el('b', '', f.j));

        var ac = el('div', 'ac');

        var no = el('span', 'no'); no.append(App.svg(f.i && App.ICON_CHOICES && App.ICON_CHOICES.indexOf(f.i) >= 0 ? f.i : 'folder')); li.append(no, t, ac); if (ctl) li.append(ctl); return li;
      }
      function btn(txt, label, fn, dis) { var b = el('button', 'gbk-mini', txt); b.type = 'button'; b.setAttribute('aria-label', label); b.title = label; b.disabled = !!dis; b.addEventListener('click', fn); return b; }
      function moveSel(L, key) {
        var s = el('select', 'gbk-sel'); s.setAttribute('aria-label', 'Pindahkan ke folder');
        var curP = L.a.filter(function (x) { return x[0] === key; })[0][1];
        function opt(v, txt) { var o = el('option', '', txt); o.value = v; if (v === curP) o.selected = true; s.append(o); }
        opt('', '📍 Game BK (utama)');
        var isF = key.indexOf('f:') === 0, fid = isF ? key.slice(2) : '';
        function walk(p, lvl) {
          kids(L, p).forEach(function (x) {
            if (x[0].indexOf('f:') !== 0) return; var id = x[0].slice(2);
            if (isF && (id === fid || inside(L, id, fid))) return;
            if (lvl + 1 + (isF ? height(L, fid) - 1 : 0) <= MAXD) opt(id, new Array(lvl + 1).join(' ') + '📁 ' + folderOf(L, id).j);
            walk(id, lvl + 1);
          });
        }
        walk('', 1);
        s.addEventListener('change', function () { var it = L.a.filter(function (x) { return x[0] === key; })[0]; L.a.splice(L.a.indexOf(it), 1); it[1] = s.value; L.a.push(it); render(); });
        return s;
      }
      function ctlFor(L, key, p) {
        var c = el('div', 'gbk-ctl'), sib = kids(L, p), idx = sib.map(function (x) { return x[0]; }).indexOf(key);
        function swap(d) { var A = sib[idx], B = sib[idx + d]; var i = L.a.indexOf(A), j = L.a.indexOf(B); L.a[i] = B; L.a[j] = A; render(); }
        c.append(btn('↑', 'Naikkan', function () { swap(-1); }, idx === 0), btn('↓', 'Turunkan', function () { swap(1); }, idx === sib.length - 1));
        if (key.indexOf('f:') === 0) {
          var id = key.slice(2);
          c.append(btn('✏️', 'Ubah nama, warna, dan ikon folder', async function () {
            var f0 = folderOf(L, id), v = await folderDialog('Ubah folder', f0); if (v) { f0.j = v.j; f0.c = v.c; f0.i = v.i; render(); }
          }), btn('🗑', 'Hapus folder', async function () {
            var f = folderOf(L, id), ok = await dialog({ title: 'Hapus folder?', text: 'Folder "' + f.j + '" dihapus. Isinya dipindahkan ke tingkat di atasnya, tidak ikut terhapus.', ok: 'Hapus folder', danger: true }); if (!ok) return;
            var par = parentOf(L, id); L.a.forEach(function (x) { if (x[1] === id) x[1] = par; });
            L.a = L.a.filter(function (x) { return x[0] !== key; }); L.f = L.f.filter(function (x) { return x.id !== id; });
            if (curId() === id) location.hash = par ? '#/f/' + par : '#/'; else render();
          }));
        }
        if (key.indexOf('g:') === 0) {
          var href = key.slice(2), g0 = BYKEY[key];
          c.append(btn('✏️', 'Ubah nama dan deskripsi game', async function () {
            var cur0 = Object.assign({}, g0, (L.m || {})[href] || {}), fld = {};
            var ok = await dialog({
              title: 'Ubah nama & deskripsi game', ok: 'Simpan', text: 'Kosongkan kolom untuk kembali ke teks bawaan.',
              build: function () {
                var w = el('div', 'gbk-pick');
                [['layanan', g0.layanan ? 'Judul utama (nama layanan)' : null], ['judul', 'Nama game'], ['label', 'Keterangan singkat'], ['isi', 'Deskripsi (jendela Info)']].forEach(function (d) {
                  if (!d[1]) return;
                  w.append(el('div', 'gbk-lb2', d[1]));
                  var i = d[0] === 'isi' ? el('textarea', 'gbk-in') : el('input', 'gbk-in');
                  if (d[0] === 'isi') i.rows = 4; i.maxLength = d[0] === 'isi' ? 700 : 120; i.value = cur0[d[0]] || ''; i.placeholder = g0[d[0]] || ''; fld[d[0]] = i; w.append(i);
                });
                return w;
              }
            });
            if (!ok) return;
            L.m = L.m || {}; var r = {};
            Object.keys(fld).forEach(function (k) { var v = fld[k].value.trim(); if (v && v !== g0[k]) r[k] = v; });
            if (Object.keys(r).length) L.m[href] = r; else delete L.m[href];
            render();
          }));
        }
        c.append(moveSel(L, key)); return c;
      }
      function render() {
        var L = cur() || norm(null), id = curId();
        if (id && !folderOf(L, id)) { location.hash = '#/'; return; }
        ul.textContent = ''; var vw = st.edit ? 'list' : getView(); ul.className = 'gbk-list v-' + vw;
        var f = id ? folderOf(L, id) : null;
        if (head1) head1.textContent = f ? f.j : h1Orig;
        if (headTxt) headTxt.textContent = f ? 'Folder · ' + countGames(L, id) + ' game' : txtOrig;
        document.title = f ? f.j + ' — Game BK' : 'Game BK';
        var flat = !layout && !st.edit && !id;
        if (flat) {
          LAYANAN.forEach(function (nm, i) {
            var g = null; GAMES.forEach(function (x) { if (x.layanan === nm) g = x; });
            if (g) ul.append(gameRow(g, i + 1));
            else { var li = el('li', 'gbk-row soon'), t = el('div', 'tt'); t.append(el('b', '', nm), el('small', '', 'Game segera hadir')); li.append(el('span', 'no', String(i + 1)), t, el('div', 'ac')); ul.append(li); }
          });
          var nx = LAYANAN.length; ORDER.forEach(function (g) { if (!g.layanan) ul.append(gameRow(g, ++nx)); });
        } else {
          var sib = kids(L, id);
          sib.forEach(function (x, i) {
            var k = x[0], ctl = st.edit ? ctlFor(L, k, id) : null;
            if (k.indexOf('g:') === 0) ul.append(gameRow(BYKEY[k], i + 1, ctl)); else ul.append(folderRow(folderOf(L, k.slice(2)), L, ctl));
          });
          if (!sib.length) { var e = el('li', 'gbk-empty', st.edit ? 'Folder ini kosong. Pindahkan game ke sini lewat menu "Pindahkan ke folder".' : 'Folder ini masih kosong.'); ul.append(e); }
        }
        bar(); views(); nav(f);
      }

      /* ---- Bilah navigasi (kembali ke folder induk, seperti situs utama) ---- */
      function nav(f) {
        var L = cur();
        if (homeBtnMade) { homeBtnMade.remove(); homeBtnMade = null; }
        if (!f) { home.innerHTML = homeOrig.html; home.setAttribute('href', homeOrig.href); home.className = homeOrig.cls; return; }
        var par = L ? parentOf(L, f.id) : '', pf = par ? folderOf(L, par) : null;
        home.setAttribute('href', par ? '#/f/' + par : '#/'); home.className = homeOrig.cls; home.classList.add('back-folder');
        var tt = el('span', 'bf-t', pf ? pf.j : 'Game BK'); home.replaceChildren(App.svg('back'), tt);
        if (!homeBtn0) {
          var h = el('a', 'icon-btn home-btn'); h.href = './'; h.setAttribute('aria-label', 'Beranda'); h.title = 'Beranda'; h.append(App.svg('home'));
          home.parentNode.insertBefore(h, acct); homeBtnMade = h;
        }
      }

      /* ---- Mode atur folder (admin) ---- */
      function tok() { try { return sessionStorage.getItem('gk_tok') || sessionStorage.getItem('admin_token') || ''; } catch (e) { return ''; } }
      function setTok(t) { try { if (t) sessionStorage.setItem('gk_tok', t); else sessionStorage.removeItem('gk_tok'); } catch (e) {} }
      async function ensureTok() {
        if (tok()) return tok();
        for (;;) {
          var pw = await dialog({ title: '🔒 Atur folder Game BK', text: 'Masukkan password admin Speganam.', input: 'password', max: 64, ok: 'Masuk' });
          if (!pw) return null;
          try { var d = await App.post({ action: 'login', password: pw }); if (d && d.token) { setTok(d.token); return d.token; } } catch (e) { toast(e && e.message || 'Password salah.', true); }
        }
      }
      var tools = el('div', 'gbk-tools'); tools.hidden = true; ul.parentNode.insertBefore(tools, ul);
      function bar() {
        tools.textContent = '';
        acct.classList.toggle('on', !!tok()); acct.title = st.edit ? 'Mode atur folder aktif' : tok() ? 'Atur folder (admin)' : 'Masuk admin untuk mengatur folder';
        if (!st.edit) { tools.hidden = true; return; }
        tools.hidden = false;
        var id = curId(), L = st.work;
        var add = el('button', 'gbk-about', '➕ Folder baru'); add.type = 'button';
        add.onclick = async function () {
          if (id && depth(L, id) >= MAXD) { toast('Folder bersarang maksimal ' + MAXD + ' tingkat.', true); return; }
          var v = await folderDialog(id ? 'Folder baru di dalam folder ini' : 'Folder baru di halaman utama', null); if (!v) return;
          var nid = 'f' + Math.random().toString(36).slice(2, 8).replace(/[^a-z0-9]/g, 'x');
          L.f.push({ id: nid, j: v.j, c: v.c, i: v.i }); L.a.push(['f:' + nid, id]); render();
        };
        var sv = el('button', 'gbk-play', '✔ Simpan susunan'); sv.type = 'button'; sv.style.setProperty('--ac', '#3BA776'); sv.onclick = simpan;
        var bt = el('button', 'gbk-about', '✕ Batal'); bt.type = 'button'; bt.onclick = function () { st.edit = false; st.work = null; render(); };
        var vs = el('select', 'gbk-sel'); vs.setAttribute('aria-label', 'Tampilan bawaan untuk pengunjung');
        VIEWS.forEach(function (v) { var o = el('option', '', 'Tampilan bawaan: ' + v[1]); o.value = v[0]; if ((L.vw || 'list') === v[0]) o.selected = true; vs.append(o); });
        vs.onchange = function () { L.vw = vs.value; };
        var lo = el('button', 'gbk-about', 'Keluar admin'); lo.type = 'button';
        lo.onclick = function () { setTok(''); try { sessionStorage.removeItem('admin_token'); } catch (e) {} st.edit = false; st.work = null; render(); toast('Keluar dari mode admin.'); };
        tools.append(el('span', 'gbk-tl', 'Mode atur folder'), add, vs, sv, bt, lo);
      }
      async function simpan() {
        var conf = { v: 1, f: st.work.f, a: st.work.a, m: st.work.m || {}, vw: st.work.vw || 'list' };
        for (var n = 0; n < 2; n++) {
          var t = await ensureTok(); if (!t) return;
          try {
            await App.post({ action: 'admin.game.saveconfig', id: LID, conf: conf, token: t });
            layout = norm(conf); writeCache(layout); st.edit = false; st.work = null; render(); toast('Susunan tersimpan di server. Berlaku di semua perangkat.'); return;
          } catch (e) { if (e && e.code === 'AUTH') { setTok(''); try { sessionStorage.removeItem('admin_token'); } catch (x) {} continue; } toast(e && e.message || 'Gagal menyimpan.', true); return; }
        }
      }
      async function mulaiEdit() {
        var t = await ensureTok(); if (!t) return;
        st.edit = true; st.work = JSON.parse(JSON.stringify(layout || norm(null))); render();
      }
      /* Tombol akun di bilah atas (seperti situs utama): masuk sebagai admin lalu atur folder. */
      var acct = el('button', 'icon-btn', ''); acct.id = 'acctBtn'; acct.type = 'button'; acct.setAttribute('aria-label', 'Akun admin'); acct.append(App.svg('user'));
      home.parentNode.insertBefore(acct, $('themeBtn'));
      acct.addEventListener('click', function () { if (!st.edit) mulaiEdit(); });
      /* Pemilih tampilan: daftar, kartu, ringkas (pilihan tersimpan di perangkat ini) */
      var IC = { list: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>', grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>', compact: '<path d="M4 6h16M4 10h16M4 14h16M4 18h16"/>' };
      var vbar = el('div', 'gbk-views'), vinfo = el('div', 'gbk-vl'), vgrp = el('div', 'gbk-vg'); vgrp.setAttribute('role', 'group'); vgrp.setAttribute('aria-label', 'Tampilan daftar'); vbar.append(vinfo, vgrp);
      VIEWS.forEach(function (v) { var b = el('button', 'gbk-vb'); b.type = 'button'; b.dataset.v = v[0]; b.title = v[1]; b.setAttribute('aria-label', 'Tampilan ' + v[1]); b.append(icoSvg(IC[v[0]]), el('span', '', v[1])); b.addEventListener('click', function () { setView(v[0]); }); vgrp.append(b); });
      ul.parentNode.insertBefore(vbar, tools);
      function views() {
        vbar.hidden = st.edit;
        var L = cur(), id = curId(), n = 0, nf = 0, parts = [];
        vinfo.textContent = '';
        if (L) {
          kids(L, id).forEach(function (x) { if (x[0].indexOf('g:') === 0) n++; else nf++; });
          var chain = [], p = id, g = 0; while (p && g++ < 6) { chain.unshift(p); p = parentOf(L, p); }
          var root = el('a', 'gbk-cr', 'Game BK'); root.href = '#/'; vinfo.append(root);
          chain.forEach(function (c, i) { vinfo.append(el('span', 'gbk-sp', '›')); var f = folderOf(L, c); if (i === chain.length - 1) vinfo.append(el('b', '', f.j)); else { var a = el('a', 'gbk-cr', f.j); a.href = '#/f/' + c; vinfo.append(a); } });
          if (nf) parts.push(nf + ' folder'); if (n) parts.push(n + ' game');
        } else { vinfo.append(el('b', '', 'Semua game')); parts.push(ORDER.length + ' game'); }
        vinfo.append(el('span', 'gbk-cnt', parts.length ? '· ' + parts.join(' · ') : '· kosong'));
        vbar.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === getView() ? 'true' : 'false'); }); }
      window.addEventListener('hashchange', render);

      try {
        App.get({ action: 'gameconfig', id: LID }, { silent: true }).then(function (d) {
          if (d && d.conf && d.conf.v === 1 && !st.edit) { layout = norm(d.conf); writeCache(layout); render(); }
        }).catch(function () {});
      } catch (e) {}
    })();
  </script>
  <script>
    /* Aturan Global: nilai bawaan untuk semua game di perangkat ini. Pengaturan khusus per game (di editor game) tetap menimpa. */
    (function () {
      var LS = 'bk_global';
      var F = [
        { k: 'poinKuis', l: 'Poin tiap jawaban atau pilihan yang tepat', min: 0, max: 100, ph: 'bawaan game' },
        { k: 'detikJawab', l: 'Batas waktu menjawab (detik, 0 = tanpa batas)', min: 0, max: 600, ph: 'bawaan game' },
        { k: 'putaran', l: 'Jumlah giliran tiap kelompok (game bergiliran)', min: 1, max: 10, ph: 'bawaan game' },
        { k: 'jml', l: 'Jumlah kelompok bawaan saat memulai sesi (2 sampai 6)', min: 2, max: 6, ph: '4' }
      ];
      function baca() { try { var g = JSON.parse(localStorage.getItem(LS) || 'null'); return g && typeof g === 'object' ? g : {}; } catch (e) { return {}; } }
      function tulis(g) { try { if (Object.keys(g).length) localStorage.setItem(LS, JSON.stringify(g)); else localStorage.removeItem(LS); return true; } catch (e) { return false; } }
      function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      var ov = document.createElement('div'); ov.className = 'gbk-ov'; ov.hidden = true; document.body.appendChild(ov);
      function tutup() { ov.hidden = true; ov.innerHTML = ''; }
      function buka() {
        var g = baca();
        ov.innerHTML = '<div class="gbk-dlg" role="dialog" aria-modal="true" aria-label="Aturan Global"><button type="button" class="gbk-x" aria-label="Tutup">×</button><h3>Aturan Global</h3>' +
          '<p>Nilai bawaan untuk semua game, tersimpan di perangkat ini. Kosongkan kolom untuk memakai bawaan masing-masing game. Aturan yang diubah khusus di editor sebuah game tetap menang untuk game itu. Aturan yang tidak dimiliki sebuah game (misalnya dadu atau tabrak pada Tangga Karakter) tetap diatur di game itu.</p>' +
          F.map(function (f) { return '<label style="display:grid;gap:.25rem;font-weight:800;font-size:.9rem">' + esc(f.l) + '<input type="number" data-k="' + f.k + '" min="' + f.min + '" max="' + f.max + '" placeholder="' + f.ph + '" value="' + (g[f.k] != null ? esc(g[f.k]) : '') + '" style="font:inherit;padding:.5rem .7rem;border:3px solid var(--ol);border-radius:12px;background:var(--sb);color:var(--si)"></label>'; }).join('') +
          '<div class="gbk-act"><button type="button" class="gbk-play" id="glSave" style="--ac:#3BA776">Simpan</button><button type="button" class="gbk-about" id="glReset">Kembalikan ke bawaan</button></div><p id="glMsg" style="min-height:1.2em;font-weight:800"></p></div>';
        ov.hidden = false;
        ov.querySelector('.gbk-x').onclick = tutup;
        ov.querySelector('#glReset').onclick = function () { tulis({}); ov.querySelectorAll('input').forEach(function (i) { i.value = ''; }); ov.querySelector('#glMsg').textContent = 'Kembali ke bawaan game.'; };
        ov.querySelector('#glSave').onclick = function () {
          var n = {};
          ov.querySelectorAll('input').forEach(function (i) {
            if (i.value === '') return; var v = Math.round(+i.value); if (!isFinite(v)) return;
            var f = F.filter(function (x) { return x.k === i.dataset.k; })[0]; n[i.dataset.k] = Math.min(f.max, Math.max(f.min, v));
          });
          ov.querySelector('#glMsg').textContent = tulis(n) ? 'Tersimpan. Berlaku saat game dibuka berikutnya.' : 'Gagal menyimpan di perangkat ini.';
        };
      }
      ov.addEventListener('mousedown', function (e) { if (e.target === ov) tutup(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !ov.hidden) tutup(); });
      var b = document.getElementById('glBtn'); if (b) b.addEventListener('click', buka);
    })();
  </script>
