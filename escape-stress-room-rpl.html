const KEY="rpl_"+ID+"_v1";

let S=load();
function newS(){return {setup:false,kelas:"",names:["Kelompok A","Kelompok B","Kelompok C","Kelompok D"],i:0,visited:{},tally:{},obs:{},hasil:{},notes:{},plans:{},g:null,turn:0,jalur:0,start:Date.now()}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.names)return Object.assign(newS(),s)}catch(e){}return null}
function save(){try{if(S)localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function modal(html){return new Promise(res=>{$("#mbox").innerHTML=html;$("#mod").classList.remove("hidden");$("#mbox").onclick=e=>{const b=e.target.closest("[data-v]");if(b){$("#mod").classList.add("hidden");res(b.dataset.v)}}})}
/* ---------- timer ---------- */
const TM={left:0,run:false,iv:null,id:null};
function tmReset(f){clearInterval(TM.iv);TM.run=false;TM.id=f.id;TM.left=f.menit*60;if(S.tm&&S.tm[f.id]!=null)TM.left=S.tm[f.id]}
function tmPaint(){const e=$("#tm");if(e){e.textContent=fmt(Math.max(0,TM.left));e.classList.toggle("low",TM.left<=60&&TM.left>0)}const b=$("#tmb");if(b)b.textContent=TM.run?"⏸":"▶"}
function tmToggle(){
  if(TM.run){clearInterval(TM.iv);TM.run=false}
  else{TM.run=true;TM.iv=setInterval(()=>{TM.left--;S.tm=S.tm||{};S.tm[TM.id]=TM.left;if(TM.left<=0){clearInterval(TM.iv);TM.run=false;toast("⏰ Waktu fase habis")}tmPaint();if(TM.left%10===0)save()},1000)}
  tmPaint();
}

let BRT=null;
function gameInit(){S.g={room:0,qi:0,t:0,stress:0,keys:0,rows:S.names.map(()=>({ok:0,bad:0})),tries:0,wrongs:[],ans:null,phase:"intro",end:false,started:false}}
function gameHtml(){
  if(!S.g)gameInit();const g=S.g;
  if(!g.started)return `<div id="gw"><div class="card"><h3>Cara bermain</h3><ol class="pts"><li>Seluruh kelas terkunci di <b>Escape the Stress Room</b>. Semua kelompok bekerja sama membuka <b>5 ruangan</b>, tiap ruangan punya 3 gembok.</li><li>Kelompok bergiliran. Kelompok berdiskusi, lalu menyebutkan jawabannya; guru mengetuk pilihan tersebut.</li><li>Jawaban tepat: gembok terbuka dan meter stres turun. Jawaban belum tepat: meter stres naik, dan gembok yang sama diserahkan ke kelompok berikutnya (pilihan yang salah dicoret).</li><li>Setelah tiga gembok, kunci ruangan didapat dan kelas bersama-sama menjawab satu kartu refleksi.</li><li>Kalau meter stres penuh, semua berhenti sejenak untuk latihan napas menenangkan diri.</li></ol></div><div class="mact" style="justify-content:flex-start"><button class="btn pri" id="gStart">▶ Masuk ke Ruang Stres</button></div></div>`;
  return `<div id="gw">${boardHtml()}</div>`;
}
function boardHtml(){
  const g=S.g;
  const doors=`<div class="doors">${ROOMS.map((r,i)=>`<div class="door ${i<g.keys?"open":""} ${i===g.room&&!g.end?"cur":""}">${i<g.keys?"🗝️":r.e} ${esc(r.n)}</div>`).join("")}</div>`;
  const meter=`<div class="card" style="padding:10px 16px"><b>Meter stres kelas</b> · ${g.stress}/5<div class="meter"><i style="width:${g.stress*20}%"></i></div></div>`;
  if(g.end)return doors+resultHtml();
  const R=ROOMS[g.room];
  if(g.phase==="breath")return doors+meter+breathCard("Meter stres penuh! Berhenti sejenak dan tenangkan diri bersama-sama.","stress");
  if(g.phase==="intro")return doors+meter+`<div class="card"><h3>${R.e} ${esc(R.n)}</h3><div class="big">${esc(R.intro)}</div><p class="txt">Giliran pertama: <b>${esc(S.names[g.t])}</b></p><button class="btn pri" id="gGo">🔓 Mulai ruangan</button> <button class="btn" id="gEnd">🏁 Akhiri permainan</button></div>`;
  if(g.phase==="refl")return doors+meter+`<div class="card"><h3>🗝️ Kunci ${g.room+1} didapat · ${esc(R.n)}</h3><div class="big">${esc(R.refl)}</div><p class="txt">Seluruh kelas menjawab bersama (dua atau tiga murid menyampaikan).</p>${R.breath?`<p class="txt">Sebelum lanjut, lakukan latihan napas bersama.</p>`:""}<div class="mact" style="justify-content:flex-start">${R.breath?`<button class="btn pri" id="gBreath">🌬 Latihan napas</button>`:""}<button class="btn ${R.breath?"":"pri"}" id="gNextRoom">${g.room>=4?"🚪 Buka pintu keluar":"Ke ruangan berikutnya ➜"}</button></div></div>`;
  if(g.phase==="breath2")return doors+meter+breathCard("Latihan napas bersama","room");
  const Q=R.q[g.qi];
  return doors+meter+`<div class="card"><h3>${esc(S.names[g.t])} · ${R.e} ${esc(R.n)} · Gembok ${g.qi+1}/3</h3><div class="big">${esc(Q.q)}</div>
   ${Q.o.map((t,k)=>`<button class="opt ${g.ans!=null?(k===Q.a?"ok":k===g.ans?"bad":""):""}" data-opt="${k}" ${(g.ans!=null||g.wrongs.includes(k))?"disabled":""} style="${g.wrongs.includes(k)&&g.ans==null?"opacity:.35;text-decoration:line-through":""}">${"ABC"[k]}. ${esc(t)}</button>`).join("")}
   ${g.ans!=null?`<div class="expl"><b>${g.ans===Q.a?"🔓 Gembok terbuka! ":"💬 Belum tepat. "}</b>${esc(Q.e)}</div><div class="mact" style="justify-content:flex-start"><button class="btn pri" id="gNext">Lanjut ➜</button></div>`:`<p class="txt" style="color:var(--muted);font-size:14px">${g.wrongs.length?"Dioper dari kelompok sebelumnya, pilihan yang salah dicoret. ":""}Kelompok berdiskusi, lalu guru mengetuk jawaban yang disebut.</p>`}</div>`;
}
function breathCard(j,mode){return `<div class="card" style="text-align:center"><h3>${esc(j)}</h3><div class="breath" id="brt">Siap?</div><p class="txt" id="brtTxt">Duduk nyaman, bahu turun. Tiga putaran: tarik napas 4 hitungan, tahan 2, hembuskan 6.</p><button class="btn pri" id="gBrtGo" data-mode="${mode}">▶ Mulai</button></div>`}
function resultHtml(){
  const g=S.g;
  return `<div class="card"><h3>🎉 Pintu keluar terbuka!</h3><div class="big">${g.keys>=5?"Kelas berhasil keluar dari Ruang Stres bersama-sama.":"Permainan dihentikan."}</div>
  <p class="txt">Kunci terkumpul: <b>${g.keys}/5</b> · Meter stres akhir: <b>${g.stress}/5</b></p>
  <div class="rank">${S.names.map((n,i)=>`<div><span><b>${esc(n)}</b></span><span>${g.rows[i].ok} gembok tepat · ${g.rows[i].bad} dibahas</span></div>`).join("")}</div>
  <p class="txt" style="margin-top:12px">Pesan: menjaga kesehatan mental adalah kerja bersama. Mengenali perasaan, menenangkan diri, dan meminta bantuan bukan tanda lemah.</p>
  <div class="mact" style="justify-content:flex-start"><button class="btn" id="gAgain">🔁 Main ulang</button><button class="btn pri" data-go="${S.i+1}">➡ Lanjut ke Rencana</button></div></div>`;
}
function gameBind(){
  const w=$("#gw");if(!w)return;
  const rr=()=>{clearInterval(BRT);w.innerHTML=gameHtml();gameBind();save()};
  const q=id=>w.querySelector(id);
  const nextGroup=()=>{S.g.t=(S.g.t+1)%S.names.length};
  if(q("#gStart"))q("#gStart").onclick=()=>{S.g.started=true;rr()};
  if(q("#gGo"))q("#gGo").onclick=()=>{S.g.phase="q";rr()};
  if(q("#gEnd"))q("#gEnd").onclick=()=>{S.g.end=true;rr()};
  if(q("#gAgain"))q("#gAgain").onclick=()=>{gameInit();S.g.started=true;rr()};
  if(q("#gBreath"))q("#gBreath").onclick=()=>{S.g.phase="breath2";rr()};
  if(q("#gNextRoom"))q("#gNextRoom").onclick=()=>{const g=S.g;g.room++;g.qi=0;g.wrongs=[];g.ans=null;if(g.room>=5){g.room=4;g.end=true}else g.phase="intro";rr()};
  w.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
    const g=S.g,Q=ROOMS[g.room].q[g.qi],k=+b.dataset.opt;
    if(k===Q.a){g.ans=k;g.rows[g.t].ok++;g.stress=Math.max(0,g.stress-1)}
    else{g.rows[g.t].bad++;g.stress=Math.min(5,g.stress+1);g.wrongs.push(k);
      if(g.wrongs.length>=2){g.ans=k}  // dua kali salah: jawaban dibuka dan dibahas
      else{ if(g.stress>=5){g.phase="breath";g.stress=5} nextGroup(); }}
    rr();
  });
  if(q("#gNext"))q("#gNext").onclick=()=>{
    const g=S.g;g.ans=null;g.wrongs=[];g.qi++;nextGroup();
    if(g.qi>=3){g.keys=g.room+1;g.phase="refl"}
    else if(g.stress>=5)g.phase="breath";
    rr();
  };
  if(q("#gBrtGo"))q("#gBrtGo").onclick=e=>{
    const mode=e.target.dataset.mode,el=$("#brt"),tx=$("#brtTxt");e.target.disabled=true;
    const steps=[["Tarik napas… 4",4,true],["Tahan… 2",2,true],["Hembuskan pelan… 6",6,false]];
    let cyc=0,si=0,left=steps[0][1];
    const paint=()=>{const s=steps[si];el.textContent=s[0].split("…")[0];tx.textContent=s[0]+" ("+left+")";el.classList.toggle("in",s[2])};
    paint();
    BRT=setInterval(()=>{
      left--;
      if(left<=0){si++;if(si>=3){si=0;cyc++}
        if(cyc>=3){clearInterval(BRT);el.textContent="Bagus 🙂";tx.textContent="Latihan selesai. Rasakan tubuh yang lebih tenang.";el.classList.remove("in");
          setTimeout(()=>{const g=S.g;if(mode==="stress"){g.stress=2;g.phase="q"}else g.phase="refl";rr()},1500);return}
        left=steps[si][1]}
      paint();
    },1000);
  };
}
function gameRows(){const g=S&&S.g;return g?[...S.names.map((n,i)=>[n,g.rows[i].ok,g.rows[i].bad]),["Kunci kelas",g.keys+"/5","stres akhir "+g.stress+"/5"]]:[]}

function openEditor(){
  ED=JSON.parse(JSON.stringify(INFO));
  $("#mbox").innerHTML=edHtml();$("#mod").classList.remove("hidden");
  $("#mbox").onclick=async e=>{
    const ba=e.target.closest("[data-bga]");
    if(ba){const[a,i]=ba.dataset.bga.split("|"),n=+i,B=ED.bagian;
      if(a==="add")B.push({j:"",tipe:"teks",isi:""});else if(a==="del")B.splice(n,1);else if(a==="up"&&n>0)[B[n-1],B[n]]=[B[n],B[n-1]];else if(a==="dn"&&n<B.length-1)[B[n+1],B[n]]=[B[n],B[n+1]];
      edRender();return}
    if(e.target.id==="edSave"){await edSave();return}
    if(e.target.closest('[data-v="cancel"]')){$("#mod").classList.add("hidden");openInfo()}
  };
  $("#mbox").oninput=e=>{
    const k=e.target.dataset.e;
    if(k){ED[k]=(k==="capaian"||k==="tujuan")?e.target.value.split("\n"):e.target.value;return}
    const g=e.target.dataset.bg;if(g){const[i,f]=g.split("|");ED.bagian[+i][f]=e.target.value}
  };
  $("#mbox").onchange=$("#mbox").oninput;
}
async function edSave(){
  const info=cleanAbout(ED),b=$("#edSave");b.disabled=true;
  try{
    try{localStorage.setItem(BG_LS,JSON.stringify(info.bagian))}catch(e){}
    const back=cleanAbout(await GK.info.save(ABOUT_ID,info));
    const lost=info.bagian.length&&!back.bagian.length;
    INFO=withBg(back);
    toast(lost?"Bagian tambahan baru tersimpan di perangkat ini saja (server belum diperbarui)":"Info game tersimpan");
    $("#mod").classList.add("hidden");openInfo();
  }catch(e){
    b.disabled=false;
    toast(e&&e.code==="CANCEL"?"Belum tersimpan (password dibatalkan)":"Gagal menyimpan: "+(e&&e.message||"galat"));
  }
}

  <h3>Ringkasan</h3><table>${Object.keys(RPL.meta).map(k=>`<tr><td style="width:30%">${esc(k)}</td><td>${esc(RPL.meta[k])}</td></tr>`).join("")}<tr><td>Kelompok</td><td>${esc(S.names.join(", "))}</td></tr></table>
  <h3>Asesmen awal (pertanyaan pemantik)</h3><div><i>${esc(RPL.pemantik)}</i></div>${RPL.tally?`<div>Sebaran pilihan: ${RPL.tally.map(k=>esc(k)+" "+(S.tally[k]||0)).join(" · ")}</div>`:""}<div class="pre">${esc(S.notes.awal||"")}</div>
  <h3>Observasi proses</h3>${M("obs",RPL.indProses)}
  <h3>Asesmen hasil</h3>${M("hasil",RPL.indHasil)}<div class="pre">${esc(S.notes.akhir||"")}</div>
  <h3>${esc(RPL.rencanaJ)} per kelompok</h3><table><tr><th>Kelompok</th>${FIELDS.map(f=>`<th>${esc(f.l)}</th>`).join("")}</tr>${S.names.map((n,i)=>`<tr><td>${esc(n)}</td>${FIELDS.map(f=>`<td class="pre">${esc((S.plans[i]||{})[f.k]||"")}</td>`).join("")}</tr>`).join("")}</table>
  <h3>Hasil permainan</h3>${gr.length?`<table><tr>${GAME_COLS.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${gr.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</table>`:"<div>Permainan belum dimainkan.</div>"}
  <h3>Catatan guru</h3>${FASE.filter(f=>S.notes[f.id]).map(f=>`<div><b>${esc(f.judul)}</b><div class="pre">${esc(S.notes[f.id])}</div></div>`).join("")||"<div>-</div>"}
  <p style="margin-top:14px;font-size:12px;color:#555">Dibuat oleh Guru BK SMP Negeri 36 Semarang. Data tersimpan di perangkat guru dan tidak memuat nama murid.</p></div>
  <div class="mact noprint"><button class="btn" data-v="x">Tutup</button><button class="btn pri" id="bPrint">🖨 Cetak / Simpan PDF</button></div>`);
  $("#bPrint").onclick=()=>window.print();
}
function unduhXlsx(){
  const gr=gameRows(),tgl=tglIni();
  const Mx=(kind,ind)=>[["Kelompok",...ind],...S.names.map((n,i)=>[n,...ind.map((_,j)=>OBS[((S[kind][i]||[])[j])||0])])];
  const sheets=[
   {name:"Ringkasan",w:[28,70],head:-1,rows:[["RPL Bimbingan Klasikal",RPL.judul],...Object.keys(RPL.meta).map(k=>[k,RPL.meta[k]]),["Kelas",S.kelas||""],["Tanggal",tgl],["Kelompok",S.names.join(", ")],["Catatan","Data hanya tersimpan di perangkat guru. Tidak memuat nama murid."]]},
   {name:"Asesmen Awal",w:[40,80],head:0,rows:[["Pertanyaan pemantik","Catatan guru"],[RPL.pemantik,(RPL.tally?"Sebaran: "+RPL.tally.map(k=>k+" "+(S.tally[k]||0)).join(", ")+"\n":"")+(S.notes.awal||"")]]},
   {name:"Observasi Proses",w:[22,24,24,24,24],head:0,rows:Mx("obs",RPL.indProses)},
   {name:"Asesmen Akhir",w:[22,40,40,40],head:0,rows:[...Mx("hasil",RPL.indHasil),[],["Catatan observasi",S.notes.akhir||""]]},
   {name:"Rencana Kelompok",w:[22,...FIELDS.map(()=>38)],head:0,rows:[["Kelompok",...FIELDS.map(f=>f.l)],...S.names.map((n,i)=>[n,...FIELDS.map(f=>(S.plans[i]||{})[f.k]||"")])]},
   {name:"Hasil Permainan",w:GAME_COLS.map((_,i)=>i?16:24),head:0,rows:gr.length?[GAME_COLS,...gr]:[["Permainan belum dimainkan"]]},
   {name:"Catatan Guru",w:[40,90],head:0,rows:[["Fase","Catatan"],...FASE.filter(f=>S.notes[f.id]).map(f=>[f.judul,S.notes[f.id]])]}
  ];
  const blob=buildXlsx(sheets),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=`RPL-${ID}${S.kelas?"-"+S.kelas.replace(/[^\w-]+/g,""):""}-${new Date().toISOString().slice(0,10)}.xlsx`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Berkas Excel diunduh");
}
$ttl();
renderSetupScreen();
