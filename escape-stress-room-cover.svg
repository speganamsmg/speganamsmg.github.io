<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Pintu dengan lima gembok kunci bergaya futuristik">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b24"/><stop offset="0.55" stop-color="#1a1058"/><stop offset="1" stop-color="#3b1d8f"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.12" cy="0.1" r="0.7"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.95" cy="0.95" r="0.7"><stop offset="0" stop-color="#e879f9" stop-opacity="0.5"/><stop offset="1" stop-color="#e879f9" stop-opacity="0"/></radialGradient>
    <radialGradient id="exit" cx="0.5" cy="0.55" r="0.7"><stop offset="0" stop-color="#fffbe0"/><stop offset="0.5" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a4d27"/><stop offset="1" stop-color="#4a2d14"/></linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#67e8f9" stroke-opacity="0.07" stroke-width="1"/></pattern>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/><rect width="640" height="320" fill="url(#grid)"/>
  <rect width="640" height="320" fill="url(#g1)"/><rect width="640" height="320" fill="url(#g2)"/>
  <g fill="#fff" opacity="0.7"><circle cx="40" cy="42" r="1.2"/><circle cx="120" cy="24" r="1"/><circle cx="330" cy="30" r="1.3"/><circle cx="470" cy="18" r="1"/><circle cx="590" cy="52" r="1.4"/><circle cx="610" cy="150" r="1"/><circle cx="24" cy="180" r="1.1"/><circle cx="300" cy="296" r="1"/></g>

  <!-- jam yang berdetak -->
  <g transform="translate(86 76)" filter="url(#glow)">
    <circle r="34" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.9"/>
    <circle r="28" fill="rgba(2,6,23,0.55)"/>
    <path d="M0 -20V0L14 8" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="2.5" fill="#fff"/>
  </g>

  <!-- pintu -->
  <g transform="translate(218 40)">
    <rect x="-12" y="-12" width="204" height="268" rx="16" fill="#0a0e26" stroke="#38477f" stroke-width="6"/>
    <rect x="0" y="0" width="180" height="244" rx="8" fill="url(#exit)"/>
    <rect x="52" y="104" width="76" height="26" rx="6" fill="#16a34a" filter="url(#glow)"/>
    <path d="M66 117h22m-8-6 8 6-8 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="0,0 74,14 74,230 0,244" fill="url(#wood)" stroke="#2e1b0b" stroke-width="3"/>
    <g fill="#241405" stroke="#9a6b2f" stroke-width="2.5">
      <circle cx="30" cy="40" r="10"/><circle cx="32" cy="82" r="10"/><circle cx="33" cy="124" r="10"/><circle cx="32" cy="166" r="10"/><circle cx="30" cy="208" r="10"/>
    </g>
    <g fill="#4ade80" filter="url(#glow)"><circle cx="30" cy="40" r="6"/><circle cx="32" cy="82" r="6"/><circle cx="33" cy="124" r="6"/></g>
    <circle cx="66" cy="124" r="4" fill="#fde68a"/>
  </g>

  <!-- kunci melayang -->
  <g filter="url(#glow)" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(480 92) rotate(-28)"><circle cx="0" cy="0" r="12"/><path d="M12 0h42M40 0v12M52 0v9"/></g>
    <g transform="translate(540 190) rotate(18) scale(.8)" stroke="#e879f9"><circle cx="0" cy="0" r="12"/><path d="M12 0h42M40 0v12M52 0v9"/></g>
  </g>

  <text x="520" y="262" text-anchor="middle" font-family="Orbitron,Segoe UI,Arial,sans-serif" font-weight="900" font-size="22" fill="url(#ttl)">STRESS ROOM</text>
  <text x="520" y="284" text-anchor="middle" font-family="Orbitron,Segoe UI,Arial,sans-serif" font-weight="700" font-size="11" letter-spacing="3" fill="#a5b4fc">ESCAPE · GAME BK</text>
</svg>
