<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Papan ular tangga karier bergaya futuristik">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b24"/>
      <stop offset="0.55" stop-color="#1a1058"/>
      <stop offset="1" stop-color="#3b1d8f"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.12" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.95" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ld" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#67e8f9" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <rect width="640" height="320" fill="url(#grid)"/>
  <rect width="640" height="320" fill="url(#g1)"/>
  <rect width="640" height="320" fill="url(#g2)"/>

  <!-- bintang -->
  <g fill="#fff">
    <circle cx="40" cy="44" r="1.6" opacity=".8"/><circle cx="92" cy="110" r="1.1" opacity=".6"/>
    <circle cx="64" cy="210" r="1.8" opacity=".7"/><circle cx="130" cy="272" r="1.2" opacity=".5"/>
    <circle cx="150" cy="60" r="1.3" opacity=".6"/><circle cx="560" cy="40" r="1.6" opacity=".8"/>
    <circle cx="604" cy="130" r="1.2" opacity=".6"/><circle cx="580" cy="250" r="1.8" opacity=".7"/>
    <circle cx="520" cy="290" r="1.1" opacity=".5"/><circle cx="610" cy="300" r="1.3" opacity=".5"/>
  </g>
  <!-- cincin orbit -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.35">
    <ellipse cx="320" cy="160" rx="300" ry="120" transform="rotate(-14 320 160)"/>
    <ellipse cx="320" cy="160" rx="250" ry="92" stroke="#e879f9" stroke-opacity="0.3" transform="rotate(10 320 160)"/>
  </g>

  <!-- papan -->
  <g transform="translate(180 22)">
    <g fill="#ffffff" fill-opacity="0.06" stroke="#67e8f9" stroke-opacity="0.35">
      <rect x="0" y="0" width="36" height="36" rx="7"/><rect x="40" y="0" width="36" height="36" rx="7"/><rect x="80" y="0" width="36" height="36" rx="7"/><rect x="120" y="0" width="36" height="36" rx="7"/><rect x="160" y="0" width="36" height="36" rx="7"/><rect x="200" y="0" width="36" height="36" rx="7"/><rect x="240" y="0" width="36" height="36" rx="7"/>
      <rect x="0" y="40" width="36" height="36" rx="7"/><rect x="40" y="40" width="36" height="36" rx="7"/><rect x="80" y="40" width="36" height="36" rx="7"/><rect x="120" y="40" width="36" height="36" rx="7"/><rect x="160" y="40" width="36" height="36" rx="7"/><rect x="200" y="40" width="36" height="36" rx="7"/><rect x="240" y="40" width="36" height="36" rx="7"/>
      <rect x="0" y="80" width="36" height="36" rx="7"/><rect x="40" y="80" width="36" height="36" rx="7"/><rect x="80" y="80" width="36" height="36" rx="7"/><rect x="120" y="80" width="36" height="36" rx="7"/><rect x="160" y="80" width="36" height="36" rx="7"/><rect x="200" y="80" width="36" height="36" rx="7"/><rect x="240" y="80" width="36" height="36" rx="7"/>
      <rect x="0" y="120" width="36" height="36" rx="7"/><rect x="40" y="120" width="36" height="36" rx="7"/><rect x="80" y="120" width="36" height="36" rx="7"/><rect x="120" y="120" width="36" height="36" rx="7"/><rect x="160" y="120" width="36" height="36" rx="7"/><rect x="200" y="120" width="36" height="36" rx="7"/><rect x="240" y="120" width="36" height="36" rx="7"/>
      <rect x="0" y="160" width="36" height="36" rx="7"/><rect x="40" y="160" width="36" height="36" rx="7"/><rect x="80" y="160" width="36" height="36" rx="7"/><rect x="120" y="160" width="36" height="36" rx="7"/><rect x="160" y="160" width="36" height="36" rx="7"/><rect x="200" y="160" width="36" height="36" rx="7"/><rect x="240" y="160" width="36" height="36" rx="7"/>
      <rect x="0" y="200" width="36" height="36" rx="7"/><rect x="40" y="200" width="36" height="36" rx="7"/><rect x="80" y="200" width="36" height="36" rx="7"/><rect x="120" y="200" width="36" height="36" rx="7"/><rect x="160" y="200" width="36" height="36" rx="7"/><rect x="200" y="200" width="36" height="36" rx="7"/><rect x="240" y="200" width="36" height="36" rx="7"/>
      <rect x="0" y="240" width="36" height="36" rx="7"/><rect x="40" y="240" width="36" height="36" rx="7"/><rect x="80" y="240" width="36" height="36" rx="7"/><rect x="120" y="240" width="36" height="36" rx="7"/><rect x="160" y="240" width="36" height="36" rx="7"/><rect x="200" y="240" width="36" height="36" rx="7"/><rect x="240" y="240" width="36" height="36" rx="7"/>
    </g>
    <!-- kotak khusus -->
    <rect x="80" y="160" width="36" height="36" rx="7" fill="#fbbf24" fill-opacity="0.28" stroke="#fbbf24" stroke-opacity="0.8"/>
    <rect x="200" y="120" width="36" height="36" rx="7" fill="#a78bfa" fill-opacity="0.3" stroke="#a78bfa" stroke-opacity="0.8"/>
    <rect x="160" y="200" width="36" height="36" rx="7" fill="#f472b6" fill-opacity="0.3" stroke="#f472b6" stroke-opacity="0.8"/>
    <rect x="240" y="0" width="36" height="36" rx="7" fill="#fbbf24" fill-opacity="0.4" stroke="#fde68a"/>
    <text x="258" y="24" text-anchor="middle" font-family="Orbitron,Segoe UI,Arial,sans-serif" font-weight="800" font-size="11" fill="#fff7d6">100</text>
    <rect x="0" y="240" width="36" height="36" rx="7" fill="#34d399" fill-opacity="0.35" stroke="#6ee7b7"/>
  </g>

  <!-- tangga -->
  <g filter="url(#glow)" stroke-linecap="round">
    <g stroke="url(#ld)" stroke-width="5">
      <line x1="232" y1="268" x2="305" y2="107"/>
      <line x1="244" y1="274" x2="317" y2="113"/>
    </g>
    <g stroke="#fff6cf" stroke-width="3.2">
      <line x1="236" y1="256" x2="248" y2="262"/><line x1="244" y1="238" x2="256" y2="244"/>
      <line x1="252" y1="220" x2="264" y2="226"/><line x1="260" y1="203" x2="272" y2="209"/>
      <line x1="268" y1="185" x2="280" y2="191"/><line x1="276" y1="168" x2="288" y2="174"/>
      <line x1="284" y1="150" x2="296" y2="156"/><line x1="292" y1="133" x2="304" y2="139"/>
      <line x1="300" y1="116" x2="312" y2="122"/>
    </g>
  </g>

  <!-- ular -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round">
    <path d="M408 56 C 486 92 372 128 418 170 S 462 238 384 280" stroke="#052e2b" stroke-width="17"/>
    <path d="M408 56 C 486 92 372 128 418 170 S 462 238 384 280" stroke="url(#sn)" stroke-width="12"/>
    <path d="M408 56 C 486 92 372 128 418 170 S 462 238 384 280" stroke="#ecfccb" stroke-width="2.4" stroke-dasharray="3 9" stroke-opacity="0.9"/>
  </g>
  <g filter="url(#glow)">
    <ellipse cx="406" cy="52" rx="15" ry="13" fill="#bef264"/>
    <circle cx="400" cy="48" r="3.6" fill="#fff"/><circle cx="412" cy="48" r="3.6" fill="#fff"/>
    <circle cx="400" cy="48.6" r="1.7" fill="#111"/><circle cx="412" cy="48.6" r="1.7" fill="#111"/>
    <path d="M406 64 l0 9 m0 0 l-4 5 m4 -5 l4 5" stroke="#fb7185" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- pion -->
  <g filter="url(#glow)">
    <circle cx="214" cy="258" r="11" fill="#fb7185" stroke="#fff" stroke-width="2.5"/>
    <circle cx="232" cy="262" r="11" fill="#22d3ee" stroke="#fff" stroke-width="2.5"/>
    <circle cx="318" cy="100" r="11" fill="#a78bfa" stroke="#fff" stroke-width="2.5"/>
    <circle cx="444" cy="216" r="11" fill="#fbbf24" stroke="#fff" stroke-width="2.5"/>
  </g>
