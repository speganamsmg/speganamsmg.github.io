<button class="btn p big" id="go">▶ Mulai permainan</button></div>
<div class="card"><b>Cara bermain</b><ol class="mut"><li>Guru membacakan soal; kelompok berdiskusi dan menyepakati satu jawaban.</li><li>Guru menekan pilihan kelompok, lalu menekan <b>Kunci jawaban</b>.</li><li>Bantuan (sekali per giliran): <b>50:50</b>, <b>Ganti soal</b>, <b>Tanya kelompok lain</b> (kelompok lain boleh memberi saran satu kalimat).</li><li>Kelompok boleh <b>Berhenti &amp; amankan poin</b> sebelum menjawab soal berikutnya.</li><li>Penilaian dilakukan melalui pengamatan guru terhadap kerja sama, empati, dan sikap saat berdiskusi; poin hanya pelengkap.</li></ol></div>`;
$("#go").onclick=()=>{const n=$("#nm").value.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,8);if(n.length<2){alert("Minimal 2 kelompok.");return}localStorage.setItem("bkmil_names",n.join("\n"));start(n);draw()}}
function draw(){if(!S)return drawSetup();const A=$("#app"),n=S.names[S.ti];
 if(S.phase==="final")return drawFinal();
 const scr=`<div class="sc">${S.names.map((x,i)=>`<div class="${i===S.ti?"on":""}">${esc(x)}<b>${S.sc[i].pts}</b></div>`).join("")}</div>`;
 const hd=`<div class="card noprint"><span class="chip">Giliran ${S.turn+1} / ${RL.putaran}</span> <b>Sekarang: ${esc(n)}</b></div>${scr}<div style="height:.8rem"></div>`;
 if(S.phase==="turnEnd"){const r=S.res;A.innerHTML=hd+`<div class="card" style="text-align:center"><div style="font-size:2.4rem">${r.rung>=TOP?"🏆":r.pts>0?"👏":"💪"}</div><h2>${esc(r.why)}</h2><p>${esc(n)} mendapat <b>${r.pts} poin</b> (anak tangga ${r.rung}).</p><button class="btn p big" id="nx">${(S.ti+1>=S.names.length&&S.turn+1>=RL.putaran)?"Lihat hasil akhir":"Kelompok berikutnya →"}</button></div>`;$("#nx").onclick=next;return}
 const q=BK[S.cur],L=["A","B","C","D"];const locked=S.res!==null&&S.res!==undefined;
 A.innerHTML=hd+`<div class="grid g2" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)"><div class="card"><span class="chip">Anak tangga ${S.rung+1}</span><span class="chip">${esc(q.b)}</span><span class="chip">${["","Mudah","Sedang","Sulit"][q.l]}</span>${RL.detikJawab?'<span class="chip" id="tmr"></span>':""}
 <div class="q">${esc(q.t)}</div>${q.o.map((o,i)=>`<button class="op ${S.hid.includes(i)?"off":""} ${S.sel===i?"sel":""} ${S.rv?(i===q.a?"ok":(S.sel===i?"no":"")):""}" data-o="${i}"><b>${L[i]}</b><span>${esc(o)}</span></button>`).join("")}
 ${S.hint?'<p class="mut">🗣 Kelompok lain: beri saran satu kalimat, kelompok yang bermain yang memutuskan.</p>':""}
 ${S.rv?`<div class="card" style="margin:.6rem 0 0"><b>${S.sel===q.a?"✅ Benar!":"❌ Belum tepat."}</b> ${esc(q.x)}</div>`:""}
 <div style="margin-top:.7rem;display:flex;gap:.5rem;flex-wrap:wrap" class="noprint">${S.rv?`<button class="btn p" id="cont">${S.sel===q.a?(S.rung+1>=TOP?"Capai puncak! 🏆":"Naik ke anak tangga berikutnya"):"Lanjut"}</button>`:`<button class="btn s" id="lock" ${S.sel==null?"disabled":""}>🔒 Kunci jawaban</button>
 <button class="btn" id="lf" ${S.lf.f?"":"disabled"}>50:50</button><button class="btn" id="ls" ${S.lf.s?"":"disabled"}>🔄 Ganti soal</button><button class="btn" id="lh" ${S.lf.h?"":"disabled"}>🗣 Tanya kelompok lain</button>
 ${S.rung>0?`<button class="btn g" id="stop">✋ Berhenti &amp; amankan ${rungPts(S.rung)} poin</button>`:""}`}</div></div>
 <div class="card"><b>Tangga ${esc(n)}</b>${ladder()}</div></div>`;
 document.querySelectorAll(".op").forEach(b=>b.onclick=()=>{if(S.rv)return;S.sel=+b.dataset.o;draw()});
 const g=id=>$("#"+id);
 if(g("lock"))g("lock").onclick=lock;
 if(g("lf"))g("lf").onclick=()=>{S.lf.f=0;const w=[0,1,2,3].filter(i=>i!==q.a).sort(()=>Math.random()-.5).slice(0,2);S.hid=w;if(w.includes(S.sel))S.sel=null;draw()};
 if(g("ls"))g("ls").onclick=()=>{S.lf.s=0;pick();draw()};
 if(g("lh"))g("lh").onclick=()=>{S.lf.h=0;S.hint=true;draw()};
 if(g("stop"))g("stop").onclick=()=>endTurn(rungPts(S.rung),S.rung,"Berhenti dengan aman");
 if(g("cont"))g("cont").onclick=()=>{if(S.sel===q.a){S.rung++;S.rv=false;if(S.rung>=TOP){endTurn(rungPts(TOP),TOP,"Puncak tangga tercapai!");return}pick();draw()}else{S.rv=false;const sf=safeOf(S.rung);endTurn(rungPts(sf),sf,sf?"Turun ke titik aman "+sf:"Belum beruntung, coba lagi giliran depan")}};
 if(RL.detikJawab&&!S.rv)timer()}
function lock(){S.rv=true;draw()}
function timer(){clearT();let t=RL.detikJawab;const e=()=>{const x=$("#tmr");if(x)x.textContent="⏱ "+t+" dtk"};e();tm=setInterval(()=>{t--;e();if(t<=0){clearT();if(S.sel==null)S.sel=-1;lock()}},1000)}

 <div style="display:flex;gap:.5rem;flex-wrap:wrap;position:sticky;bottom:.5rem"><button class="btn" id="add">+ Soal baru</button><button class="btn p" id="sv">💾 Simpan</button><button class="btn" id="rs">Kembalikan bawaan</button><button class="btn" id="cn">Batal</button></div>`;
 A.querySelectorAll("[data-r]").forEach(e=>e.oninput=()=>{r[e.dataset.r]=Math.max(0,+e.value||0)});

<style id="gbk-skin">
/* ===== GBK-SKIN v2: gaya stiker (garis tebal navy) seperti game RPL Game BK ===== */
html:root[data-theme]{--f-head:"Nunito","Plus Jakarta Sans",system-ui,sans-serif;--f-body:"Nunito","Plus Jakarta Sans",system-ui,sans-serif;
--bgm:#f3f6fd;--mesh:radial-gradient(52rem 40rem at 6% 28%,rgba(112,156,255,.46),transparent 62%),radial-gradient(44rem 34rem at 96% 8%,rgba(96,214,205,.34),transparent 62%),radial-gradient(48rem 36rem at 92% 92%,rgba(255,184,112,.46),transparent 62%),radial-gradient(40rem 26rem at 38% 104%,rgba(255,220,120,.28),transparent 62%);
--ol:#1E2A5C;--col:#F2F5FD;--ink:#1E2A5C;--muted:#5C6593;--dim:#7A82AD;--panel:#fff;--panel2:#fff;--field:#fff;--mbg:rgba(30,42,92,.5);--glass:#fff;--glass2:#EEF2FF;--line:#1E2A5C;--card:#fff;--mcard:#fff;
--cy:var(--ac,#2E9BD6);--mg:var(--ac,#2E9BD6);--gold:#B77A0A;--green:#188A55;--red:#D6453D;--vio:#6a54d6;--okbg:#DDF5E8;--nobg:#FDE3E0;--hintbg:#FFF1CC;--shadow:0 5px 0 #1E2A5C}
html:root[data-theme=dark]{--bgm:#080e1d;--mesh:radial-gradient(52rem 40rem at 6% 28%,rgba(52,96,232,.42),transparent 62%),radial-gradient(44rem 34rem at 96% 8%,rgba(24,170,168,.26),transparent 62%),radial-gradient(48rem 36rem at 92% 92%,rgba(255,160,56,.2),transparent 62%),radial-gradient(40rem 26rem at 38% 104%,rgba(255,200,80,.12),transparent 62%);
--ol:#070A22;--col:#1A1F4D;--ink:#F6F2FF;--muted:#B9BFEA;--dim:#8f96c8;--panel:#2A3170;--panel2:#2A3170;--field:#1F2560;--mbg:rgba(4,6,18,.72);--glass:#2A3170;--glass2:#353D88;--line:#070A22;--card:#2A3170;--mcard:#2A3170;
--gold:#F5C451;--green:#62E2A9;--red:#FF918A;--vio:#b7a6ff;--okbg:rgba(52,211,153,.2);--nobg:rgba(248,113,113,.2);--hintbg:rgba(245,196,81,.17);--shadow:0 5px 0 #070A22}
html body{font-family:var(--f-body);font-weight:700;background:var(--bgm)!important;isolation:isolate;color:var(--ink)}
html body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:var(--mesh)!important;animation:gbkdrift 28s ease-in-out infinite alternate;-webkit-mask-image:none!important;mask-image:none!important;opacity:1!important}
@keyframes gbkdrift{from{transform:translate3d(-1.5%,-1%,0) scale(1)}to{transform:translate3d(1.5%,1.5%,0) scale(1.06)}}
@media(prefers-reduced-motion:reduce){html body::before{animation:none}}
h1,h2,h3,h4,.btn,.tb,.chipline,.pill,.chip{font-family:var(--f-head)!important;letter-spacing:0!important}
h1,h2,h3{font-weight:900}
/* tombol */
.btn{border:3px solid var(--ol)!important;border-radius:16px!important;background:var(--card);color:var(--ink);font-weight:900;box-shadow:0 4px 0 var(--ol)!important;filter:none!important;transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(4px)!important;box-shadow:0 0 0 var(--ol)!important}
.btn.primary,.btn.p,.btn.s{background:var(--ac)!important;color:var(--acx)!important}
.btn.good,.btn.g{background:#3BA776!important;color:#fff!important}
.btn.r,.btn.bad,.btn.danger{background:#E5504D!important;color:#fff!important}
.btn.ghost{background:var(--card)!important;color:var(--ink)!important}
a.back,button.back,.tb,.stepper .sbtn,.pill,.seg,.chipline,.chip{border:3px solid var(--ol)!important;box-shadow:0 3px 0 var(--ol);background:var(--card);color:var(--ink)}
.chip.on,.seg button.on{background:var(--ac)!important;color:var(--acx)!important;border-color:var(--ol)!important}
.stepper .sbtn:active,a.back:active,button.back:active{transform:translateY(3px);box-shadow:none}
/* kartu */
.qcard,.end-card,.side .box,.panel,.hbox,.stat,.meter,.dice-box,.cellbox,.champ,.card,.judge,.lesson,.mode,.opt,.person,details.qi,.estline{border:3px solid var(--ol)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--card)}
.qcard,.end-card,.side .box,.card,.panel{border-radius:24px!important;box-shadow:0 5px 0 var(--ol)!important}
.hbox,.stat,.meter,.dice-box,.cellbox,.mode,.opt,.person,.lesson,.judge{box-shadow:0 4px 0 var(--ol)}
.opt:hover:not(:disabled),.mode:hover{border-color:var(--ol)!important;background:color-mix(in srgb,var(--ac) 14%,var(--card))!important;transform:translateY(-1px)}
.mode.on,.mode.sel,.mode.active,.mode[aria-pressed=true]{background:color-mix(in srgb,var(--ac) 22%,var(--card))!important}
.panel h3 b{background:var(--ac)!important;color:var(--acx)!important;border:2px solid var(--ol)}
input[type=text],input[type=number],input[type=password],.field,select,textarea{border:3px solid var(--ol)!important;border-radius:14px!important;background:var(--field)!important;color:var(--ink);font-weight:700}
#mcard{border:3px solid var(--ol)!important;border-radius:28px!important;box-shadow:0 7px 0 var(--ol),0 24px 60px rgba(0,0,0,.3)!important}
::selection{background:var(--ac);color:var(--acx)}
:focus-visible{outline:3px solid var(--ac)!important;outline-offset:2px}
/* halaman awal: kolom putih + bilah atas */
#setup{padding:0!important}#setup:not(.hidden){display:block!important}
.setup-card{width:min(1100px,100%)!important;margin:0 auto!important;min-height:100vh;border-radius:0!important;border-width:0 3px!important;box-shadow:none!important;background:var(--col)!important;padding:0 clamp(14px,3vw,34px) 40px!important}
.setup-top,.gbk-bar{display:flex!important;align-items:center;gap:8px;flex-wrap:nowrap!important;background:var(--card);border-bottom:3px solid var(--ol)!important;margin:0 calc(-1*clamp(14px,3vw,34px)) 18px!important;padding:9px clamp(14px,3vw,34px)!important;position:sticky;top:0;z-index:20}
.gbk-bar .navrow{display:contents}
.gbk-tt{flex:1;min-width:0;font-weight:900;font-size:13px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.gbk-bar .back{padding:7px 12px!important;border-radius:12px!important;font-size:13.5px;white-space:nowrap}
.gbk-by{text-align:center;font-size:13px;color:var(--muted);margin:10px auto 18px;line-height:1.45;max-width:560px}.gbk-by b{display:block;color:var(--ink);font-size:14px}.gbk-by span{display:block}
.hero{display:block!important;text-align:center;margin-bottom:14px!important}
.hero .cover{display:none!important}
.hero h1{font-size:clamp(34px,6vw,54px)!important;line-height:1.05;color:var(--ink)!important}
.hero h1 span{background:none!important;-webkit-text-fill-color:var(--ac)!important;color:var(--ac)!important;filter:none!important}
.hero .sub{max-width:640px;margin:8px auto 0!important;color:var(--muted)!important;font-weight:700}
.hero .chipline{margin-bottom:6px}
.gbk-meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.gbk-meta div{background:var(--card);border:3px solid var(--ol);border-radius:14px;padding:4px 12px;box-shadow:0 3px 0 var(--ol);text-align:center}
.gbk-meta small{display:block;font-size:10.5px;color:var(--muted);font-weight:800}.gbk-meta b{font-size:14px;color:var(--ink)}
.setup-grid{margin-top:16px}
.gbk-hero{--ol:#1E2A5C;--line:#1E2A5C;--bg:#FFF4DE;--bg2:#FFE9C2;--card:#FFFFFF;--ink:#1E2A5C;--muted:#5C6593;--tint:rgba(30,42,92,.06);--shadow:0 5px 0 #1E2A5C;
 --sk1:#7FCDF5;--sk2:#D6F1FC;--rk:#C9C4D8;--rk2:#A59FBF;--rk0:#E6E2F0;--g1:#ABE264;--g2:#6DC150;--tr:#43A65B;--tr2:#80D06C;--cl:#fff;--cl2:#CFE6F3;--win:#A5DEFF;--wall:#FFF6E2;--sunc:#FFD23F;--w1:#8FD6F2;--w2:#6BC3E6;--sand:#FFF4DE;--ok:#14804F;--okbg:#D6F4E2;--badbg:#FFE0DC;--bad:#D63B33;--warn:#9A6200;--ff:0;--stars:0}
html[data-theme=dark] .gbk-hero{--ol:#070A22;--line:#070A22;--bg:#1A1F4D;--bg2:#222863;--card:#2A3170;--ink:#F6F2FF;--muted:#B9BFEA;--tint:rgba(255,255,255,.07);--shadow:0 5px 0 #070A22;
 --sk1:#10163F;--sk2:#383E8C;--rk:#6F6CA3;--rk2:#4C4A7E;--rk0:#9794C8;--g1:#5CAB78;--g2:#3F8B5E;--tr:#2D7653;--tr2:#46966B;--cl:#8E95D8;--cl2:#6C73BC;--win:#FFD27A;--wall:#D8CDB5;--sunc:#FFF3C4;--w1:#2C4C96;--w2:#223C80;--sand:#1A1F4D;--ff:1;--stars:1}
.gbk-hero{--ff:0;--stars:0;--fg:#2E6B4E;position:relative;border-radius:30px;overflow:hidden;border:3px solid var(--ol);box-shadow:0 5px 0 var(--ol);background:var(--sk2);max-width:680px;margin:0 auto 14px;aspect-ratio:800/440}
html[data-theme=dark] .gbk-hero{--ff:1;--stars:1}
.gbk-hero svg.scene{display:block;width:100%;height:100%}
.gbk-hero .mas{position:absolute;left:var(--mx,33%);bottom:23.5%;height:50%;width:auto;transform-origin:50% 100%;animation:gbsway 2.6s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(30,42,92,.25));user-select:none;-webkit-user-drag:none}
@keyframes gbsway{0%,100%{transform:rotate(-1.5deg) translateY(0)}50%{transform:rotate(1.5deg) translateY(-4px)}}
.gbk-hero .s-night{display:none}html[data-theme=dark] .gbk-hero .s-night{display:inline}html[data-theme=dark] .gbk-hero .s-day{display:none}
.gbk-hero .sc-bird{stroke:var(--ol)}
.gbk-hero .rays{animation:gbray 9s ease-in-out infinite}@keyframes gbray{0%,100%{opacity:.7}50%{opacity:1}}
.gbk-hero .ff circle{fill:#FFF3A0;opacity:calc(var(--ff)*.9);animation:gbffl 3s ease-in-out infinite}.gbk-hero .ff circle:nth-child(even){animation-delay:-1.5s}
@keyframes gbffl{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(-8px);opacity:var(--ff)}}
.gbk-hero .flt2{animation:gbflt 6s ease-in-out infinite}@keyframes gbflt{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media(prefers-reduced-motion:reduce){.gbk-hero *{animation:none!important}}
/* editor teks */
#gbkFab{position:fixed;right:10px;bottom:10px;z-index:150;width:40px;height:40px;border-radius:13px;border:3px solid var(--ol);background:var(--card);color:var(--ink);font-size:17px;box-shadow:0 3px 0 var(--ol);cursor:pointer;display:grid;place-items:center;opacity:.6}
#gbkFab:hover{opacity:1}
#gbkTx{position:fixed;inset:0;z-index:2000;background:var(--mbg);display:none;place-items:center;padding:12px}
#gbkTx.on{display:grid}
#gbkTx .bx{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--mcard,var(--panel));color:var(--ink);border:3px solid var(--ol);border-radius:24px;padding:18px;box-shadow:0 7px 0 var(--ol)}
#gbkTx h3{margin:0 0 4px;font-size:20px}#gbkTx p{margin:.3rem 0;color:var(--muted);font-size:13.5px}
#gbkTx .r{margin:.5rem 0;padding:.5rem;border:3px solid var(--ol);border-radius:14px}
#gbkTx .r small{display:block;color:var(--muted);font-size:12px;margin-bottom:3px;word-break:break-word}
#gbkTx input,#gbkTx textarea,#gbkTx select{width:100%;padding:8px 10px;border-radius:10px;border:3px solid var(--ol);background:var(--field);color:var(--ink);font:inherit}
#gbkTx .ac{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem;position:sticky;bottom:-18px;background:var(--mcard,var(--panel));padding:.6rem 0}
#gbkTx .ch{background:color-mix(in srgb,var(--ac) 14%,transparent)}
@media print{#gbkFab,#gbkTx{display:none!important}}
</style>
<script id="gbk-skin-js">
/* ===== GBK-SKIN: aksen warna + editor teks (nama game, deskripsi, semua teks tampilan) ===== */
(function(){
  var SLUG=(location.pathname.split("/").pop()||"game").replace(/\.html?$/,"")||"game";
  var ID=(SLUG.replace(/[^a-z0-9-]/g,"-").slice(0,34)+"-teks").replace(/^-+/,"g");
  var LS="bkteks_"+SLUG,ACC=(document.querySelector('meta[name="gbk-accent"]')||{}).content||"#2E9BD6";
  var TXT={},AKSES="admin",DEF_ATTR=["placeholder","title","aria-label"];
  function hex(h){h=h.replace("#","");return[0,2,4].map(function(i){return parseInt(h.substr(i,2),16)})}
  function toHex(a){return"#"+a.map(function(v){return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")}).join("")}
  (function(){var c=hex(ACC),lum=(0.299*c[0]+0.587*c[1]+0.114*c[2])/255,d=toHex(c.map(function(v){return v*.68})),s=document.documentElement.style;s.setProperty("--ac",ACC);s.setProperty("--acd",d);s.setProperty("--acx",lum>.62?"#2b1c00":"#fff")})();
  var GKX=function(){return window.GameKit||null};
  var isAdm=function(){try{return !!(GKX()&&GKX().auth&&GKX().auth.token())}catch(e){return false}};
  var skip=function(n){var p=n.parentNode;return !p||/^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA)$/.test(p.nodeName)||(p.closest&&p.closest("#gbkTx,#gbkFab"))};
  var busy=false,mo=null;
  function applyNode(n){
    if(skip(n))return;var raw=n.nodeValue,t=raw.trim();if(!t)return;
    var o=n.__o!==undefined?n.__o:t;
    if(Object.prototype.hasOwnProperty.call(TXT,o)&&TXT[o]!==""){var m=raw.match(/^(\s*)[\s\S]*?(\s*)$/);var nv=m[1]+TXT[o]+m[2];if(raw!==nv){n.__o=o;n.nodeValue=nv}}
    else if(n.__o!==undefined&&n.__o!==t&&!Object.prototype.hasOwnProperty.call(TXT,n.__o)){}
  }
  function applyAll(root){
    busy=true;
    try{
      var w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT,null),n,L=[];while(n=w.nextNode())L.push(n);L.forEach(applyNode);
      (root||document).querySelectorAll&&(root||document).querySelectorAll("[placeholder],[title],[aria-label]").forEach(function(e){DEF_ATTR.forEach(function(a){if(!e.hasAttribute(a))return;var k="a:"+a,o=e["__o_"+a]!==undefined?e["__o_"+a]:e.getAttribute(a);if(Object.prototype.hasOwnProperty.call(TXT,o)&&TXT[o]!==""){e["__o_"+a]=o;e.setAttribute(a,TXT[o])}})});
      var dt=TXT["@judul"];if(dt)document.title=dt;
    }finally{busy=false}
  }
  function watch(){
    if(mo)mo.disconnect();
    mo=new MutationObserver(function(ms){if(busy)return;busy=true;try{ms.forEach(function(m){if(m.type==="characterData")applyNode(m.target);else m.addedNodes.forEach(function(a){if(a.nodeType===3)applyNode(a);else if(a.nodeType===1&&a.id!=="gbkTx")applyAll(a)})})}finally{busy=false}});
    mo.observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  function readLocal(){try{var l=JSON.parse(localStorage.getItem(LS)||"null");return l&&l.txt?l.txt:null}catch(e){return null}}
  async function init(){
    var srv=null;try{var G=GKX();if(G&&G.conf){var r=await G.conf.load(ID);if(r&&r.conf)srv=r.conf}}catch(e){}
    if(srv){if(srv.akses==="publik"||srv.akses==="admin")AKSES=srv.akses;if(srv.txt&&typeof srv.txt==="object")TXT=Object.assign({},srv.txt)}
    var l=readLocal();if(l)TXT=Object.assign(TXT,l);
    applyAll();watch();
  }
  /* ----- editor ----- */
  function collect(){
    var seen={},out=[];
    var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null),n;
    while(n=w.nextNode()){if(skip(n))continue;var t=n.nodeValue.trim();if(!t||t.length>600)continue;if(/^[\d\s.,:%+\-–/×x]+$/.test(t))continue;
      var o=n.__o!==undefined?n.__o:t;if(!seen[o]){seen[o]=1;out.push(o)}}
    document.querySelectorAll("[placeholder]").forEach(function(e){var o=e.__o_placeholder!==undefined?e.__o_placeholder:e.getAttribute("placeholder");if(o&&!seen[o]){seen[o]=1;out.push(o)}});
    return out;
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  var box=null,work=null,orig=null;
  function toast(t){var d=document.createElement("div");d.textContent=t;d.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:3000;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:9px 16px;font-weight:800;box-shadow:0 3px 0 var(--line)";document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
  async function openEd(){
    if(!isAdm()&&AKSES!=="publik"){
      var ok=null;try{ok=await GKX().auth.ensure()}catch(e){}
      if(!ok||!isAdm()){toast("Mode ubah teks dikunci untuk admin");return}
    }
    work=Object.assign({},TXT);orig=collect();
    var t0=(function(){var m=document.querySelector('meta[name="description"]');return{j:work["@judul"]||(document.title),d:work["@deskripsi"]||(m?m.content:"")}})();
    work["@judul"]=work["@judul"]||"";
    if(!box){box=document.createElement("div");box.id="gbkTx";document.body.appendChild(box)}
    var adm=isAdm();
    function render(q){q=(q||"").toLowerCase();
      box.innerHTML='<div class="bx"><h3>✏️ Ubah teks game</h3><p>Ubah nama game, deskripsi, dan semua tulisan yang tampil di layar ini. Untuk teks di layar lain (hasil, soal, dsb.), tutup panel ini, buka layar tersebut, lalu tekan ✏️ lagi. Kosongkan kolom untuk kembali ke teks bawaan.</p>'
      +'<div class="r ch"><small>Nama game (judul tab dan menu)</small><input data-k="@judul" value="'+esc(work["@judul"]||"")+'" placeholder="'+esc(document.title)+'"></div>'
      +'<div class="r ch"><small>Deskripsi game</small><textarea rows="3" data-k="@deskripsi" placeholder="'+esc(t0.d)+'">'+esc(work["@deskripsi"]||"")+'</textarea></div>'
      +(adm?'<div class="r"><small>Siapa boleh mengubah teks</small><select id="gbkAk"><option value="admin" '+(AKSES==="admin"?"selected":"")+'>Hanya admin (disimpan di server)</option><option value="publik" '+(AKSES==="publik"?"selected":"")+'>Semua pengguna (disimpan di perangkat masing-masing)</option></select></div>':"")
      +'<input id="gbkQ" placeholder="🔍 Cari teks…" value="'+esc(q)+'" style="margin:.5rem 0">'
      +orig.filter(function(o){return!q||o.toLowerCase().indexOf(q)>=0||String(work[o]||"").toLowerCase().indexOf(q)>=0}).map(function(o){var long=o.length>70||(work[o]||o).length>70;return'<div class="r"><small>'+esc(o)+'</small>'+(long?'<textarea rows="3" data-k="'+esc(o)+'" placeholder="'+esc(o)+'">'+esc(work[o]||"")+'</textarea>':'<input data-k="'+esc(o)+'" placeholder="'+esc(o)+'" value="'+esc(work[o]||"")+'">')+'</div>'}).join("")
      +'<div class="ac"><button class="btn p" id="gbkSv">💾 Simpan</button><button class="btn" id="gbkRs">Kembalikan bawaan</button><button class="btn" id="gbkCn">Tutup</button></div></div>';
      box.classList.add("on");
      var q2=box.querySelector("#gbkQ");q2.oninput=function(){var p=q2.selectionStart;render(q2.value);var n=box.querySelector("#gbkQ");n.focus();n.setSelectionRange(p,p)};
      box.querySelectorAll("[data-k]").forEach(function(e){e.oninput=function(){var v=e.value;if(v.trim()==="")delete work[e.dataset.k];else work[e.dataset.k]=v}});
      box.querySelector("#gbkCn").onclick=function(){box.classList.remove("on")};
      box.querySelector("#gbkRs").onclick=function(){if(confirm("Kembalikan semua teks ke bawaan?")){work={};save(true)}};
      box.querySelector("#gbkSv").onclick=function(){save(false)};
    }
    async function save(reset){
      var b=box.querySelector("#gbkSv");if(b)b.disabled=true;
      var clean={};Object.keys(work).forEach(function(k){if(String(work[k]).trim()!=="")clean[k]=work[k]});
      try{
        var ak=box.querySelector("#gbkAk");var newAk=ak?ak.value:AKSES;
        if(isAdm()){
          var conf={v:1,akses:newAk,txt:clean};
          try{await GKX().conf.save(ID,conf)}catch(e){if(e&&e.code==="CANCEL")throw e;toast("Server belum menerima, disimpan di perangkat ini: "+(e&&e.message||"galat"));localStorage.setItem(LS,JSON.stringify({_lokal:1,txt:clean}))}
          if(newAk==="admin"||true){try{localStorage.removeItem(LS)}catch(e){}}
          AKSES=newAk;
        }else{try{localStorage.setItem(LS,JSON.stringify({_lokal:1,txt:clean}))}catch(e){}}
        // kembalikan teks bawaan dahulu agar penggantian baru dihitung dari teks asli
        revert();TXT=clean;applyAll();
        box.classList.remove("on");toast(reset?"Teks dikembalikan ke bawaan":(isAdm()?"Tersimpan":"Tersimpan di perangkat ini"));
      }catch(e){if(b)b.disabled=false;toast(e&&e.code==="CANCEL"?"Belum tersimpan (password dibatalkan)":"Gagal menyimpan: "+(e&&e.message||"galat"))}
    }
    render("");
  }
  function revert(){
    busy=true;try{var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null),n;while(n=w.nextNode()){if(n.__o!==undefined&&!skip(n)){var m=n.nodeValue.match(/^(\s*)[\s\S]*?(\s*)$/);n.nodeValue=m[1]+n.__o+m[2];delete n.__o}}
      document.querySelectorAll("[placeholder],[title],[aria-label]").forEach(function(e){DEF_ATTR.forEach(function(a){if(e["__o_"+a]!==undefined){e.setAttribute(a,e["__o_"+a]);delete e["__o_"+a]}})})}finally{busy=false}
  }

  /* ----- halaman awal bergaya stiker: bilah atas, ilustrasi maskot, chip info ----- */
  var META={"career-quest":[["Sasaran","Kelas 9"],["Durasi","45–60 menit"],["Cara main","Berkelompok bergantian"]],
   "detektif-konflik":[["Sasaran","Kelas 8–9"],["Durasi","45–55 menit"],["Cara main","Satu tim atau bergiliran"]],
   "escape-the-stress-room":[["Sasaran","Kelas 8–9"],["Durasi","45–55 menit"],["Cara main","Satu tim atau bergiliran"]],
   "bk-millionaire":[["Sasaran","Kelas 7–9"],["Durasi","30–40 menit"],["Cara main","Berkelompok, tanpa HP"]]};
  window.gbkMeta=function(){return '<div class="gbk-meta">'+(META[SLUG]||[]).map(function(m){return '<div><small>'+m[0]+'</small><b>'+m[1]+'</b></div>'}).join("")+'</div>'};
  window.gbkHero=function(){var h=window.__GBK_HERO||"";return h?'<div class="gbk-hero" style="--c1:'+ACC+';--c1d:var(--acd);--c2:#FFD23F">'+h+'</div>':""};
  function setupHero(){
    var sc=document.querySelector("#setup .setup-card");if(!sc||sc.getAttribute("data-gbk"))return;sc.setAttribute("data-gbk","1");
    var top=sc.querySelector(".setup-top"),hero=sc.querySelector(".hero");if(!top||!hero)return;
    top.classList.add("gbk-bar");
    var h1=hero.querySelector("h1"),tt=document.createElement("span");tt.className="gbk-tt";tt.textContent=h1?h1.textContent.replace(/\s+/g," ").trim():document.title;
    var nav=top.querySelector(".navrow"),first=nav&&nav.firstElementChild;if(first&&first.nextSibling)nav.insertBefore(tt,first.nextSibling);else top.insertBefore(tt,top.firstChild);
    var by=top.querySelector(".by");if(by){by.className="by gbk-by";}
    var hv=document.createElement("div");hv.innerHTML=window.gbkHero();if(hv.firstChild)sc.insertBefore(hv.firstChild,hero);
    var sub=hero.querySelector(".sub");var m=document.createElement("div");m.innerHTML=window.gbkMeta();if(sub)sub.insertAdjacentElement("afterend",m.firstChild);
    if(by)hero.insertAdjacentElement("afterend",by);
  }
  function boot(){
    setupHero();
    var f=document.createElement("button");f.id="gbkFab";f.type="button";f.title="Ubah teks game";f.setAttribute("aria-label","Ubah teks game");f.textContent="✏️";f.onclick=openEd;document.body.appendChild(f);
    var l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap";document.head.appendChild(l);
    init();if(window.gbkRedraw)window.gbkRedraw();
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
</body></html>
