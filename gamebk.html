<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game BK</title>
  <meta name="description" content="Kumpulan game pembelajaran Bimbingan dan Konseling SMP Negeri 36 Semarang">
  <script>
    (function () {
      try {
        var p = localStorage.getItem('tema') || localStorage.getItem('tema_def') || 'auto';
        var dark = p === 'dark' || (p === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#121a33">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap">
  <link rel="stylesheet" href="style.css?v=50">
  <link rel="stylesheet" href="dashboard.css?v=50">
  <link rel="stylesheet" href="gamebk.css?v=50">
  <style>
    /* Kartu ramping: hanya gambar + judul + tombol. Deskripsi & tag pindah ke jendela Info. */
    .gbk-body { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0.6rem; padding: 0.9rem 1.2rem 1rem; }
    .gbk-body h2 { font-size: 1.2rem; }
    .gbk-play { margin-top: 0; justify-self: end; white-space: nowrap; }
    .gbk-soon .gbk-body { grid-template-columns: 1fr; }
    .gbk-grid > li { grid-template-rows: 1fr auto; }
    .gbk-grid > li > .gbk-card { grid-template-rows: auto 1fr; height: 100%; }
    button.gbk-about { font: inherit; font-size: 0.82rem; font-weight: 700; cursor: pointer; }
    .gbk-ov { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(5, 8, 22, 0.55); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
    .gbk-ov[hidden] { display: none; }
    .gbk-dlg { position: relative; width: min(30rem, 100%); max-height: 90vh; overflow: auto; display: grid; gap: 0.75rem; padding: 1.4rem 1.4rem 1.3rem; border: 1px solid var(--line); border-radius: 1.4rem; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-up); }
    .gbk-dlg h3 { margin: 0; padding-right: 2.2rem; font-size: 1.3rem; letter-spacing: -0.02em; line-height: 1.15; }
    .gbk-dlg .gbk-lbl { justify-self: start; padding: 0.12rem 0.7rem; border-radius: 99px; background: var(--tint); font-size: 0.74rem; font-weight: 700; }
    .gbk-dlg p { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.55; }
    .gbk-dlg .gbk-x { position: absolute; top: 0.8rem; right: 0.8rem; width: 2.2rem; height: 2.2rem; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--ink); font-size: 1.1rem; line-height: 1; cursor: pointer; }
    .gbk-dlg .gbk-x:hover { border-color: var(--accent); color: var(--accent); }
    .gbk-dlg .gbk-act { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.2rem; }
    .gbk-dlg .gbk-act .gbk-play { margin: 0; text-decoration: none; }
    .gbk-dlg .gbk-act .gbk-about { align-self: center; }
    @media (max-width: 420px) { .gbk-body { grid-template-columns: 1fr; } .gbk-play { justify-self: start; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <a class="btn-back" href="./" id="home"></a>
      <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="Ganti tema terang atau gelap"></button>
    </div>
    <header class="dhead gbk-head" id="dhead">
      <h1>Game BK</h1>
      <div class="rich">Game pembelajaran Bimbingan dan Konseling. Pilih satu game untuk dimainkan di kelas.</div>
    </header>
    <ul class="gbk-grid" id="games"></ul>
    <p class="gbk-credit">Dirancang oleh <b>Agung Fahri Husaeni, S.Pd.</b> · Guru BK SMP Negeri 36 Semarang</p>
  </main>
  <script src="config.js?v=50"></script>
  <script src="common.js?v=50"></script>
  <script>
    (function () {
      /* Daftar game. Untuk menambah game: simpan file game di folder yang sama, lalu tambahkan satu baris di sini. */
      var GAMES = [
        { href: 'career-quest.html', ikon: '🧭', gambar: 'career-quest-cover.svg', label: 'Semua Jenjang SMP', judul: 'Career Quest',
          isi: 'Ular tangga karier digital bergaya futuristik: kuis, refleksi, kartu kejutan, tim tanpa batas, dan soal yang bisa diatur sendiri oleh guru.',
          tag: ['Perencanaan karier', 'Berkelompok', 'Bisa diatur guru', 'Proyektor / IFP'],
          tentang: 'career-quest.html#tentang' },
        { href: 'escape-the-stress-room.html', ikon: '🚪', gambar: 'escape-stress-room-cover.svg', label: 'Kolaborasi dengan Murid', judul: 'Escape the Stress Room',
          isi: 'Game escape room digital yang berkolaborasi dengan kelompok murid Kelas 9B: lewati 5 ruangan, selesaikan kasus BK, kumpulkan 5 kunci, lalu buka pintu keluar.',
          tag: ['Pribadi-sosial', 'Berkelompok', 'Karya siswa', 'Proyektor / IFP'],
          tentang: 'escape-the-stress-room.html#tentang' },
        { href: 'detektif-konflik.html', ikon: '🕵️', gambar: 'detektif-konflik-cover.svg', label: 'Kolaborasi dengan Murid', judul: 'Detektif Konflik',
          isi: 'Game detektif digital rancangan siswa kelas 9B: kumpulkan bukti dari dua sisi cerita, pecahkan 5 kasus pertemanan, jaga meteran kepercayaan, lalu pimpin Sidang Damai. Ada mode Lengkap (±45–55 menit) dan Singkat (±15–20 menit).',
          tag: ['Pribadi-sosial', 'Berkelompok', 'Karya siswa', 'Proyektor / IFP'],
          tentang: 'detektif-konflik.html#tentang' }
      ];
      var $ = function (id) { return document.getElementById(id); };
      function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }

      var themeBtn = $('themeBtn');
      themeBtn.append(App.svg('moon', 'moon'), App.svg('sun', 'sun'));
      themeBtn.addEventListener('click', App.theme.toggle);
      App.pasangBack('gamebk');

      /* Jendela Info: deskripsi + tag + tautan capaian & tujuan BK */
      var ov = el('div', 'gbk-ov'); ov.hidden = true; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', 'Info game');
      document.body.append(ov);
      var opener = null;
      function tutupInfo() { ov.hidden = true; ov.textContent = ''; if (opener) { try { opener.focus(); } catch (e) {} opener = null; } }
      function bukaInfo(g, btn) {
        opener = btn; ov.textContent = '';
        var box = el('div', 'gbk-dlg');
        var x = el('button', 'gbk-x', '✕'); x.type = 'button'; x.setAttribute('aria-label', 'Tutup'); x.addEventListener('click', tutupInfo);
        var tags = el('div', 'gbk-tags'); (g.tag || []).forEach(function (t) { tags.append(el('span', '', t)); });
        var act = el('div', 'gbk-act');
        var play = el('a', 'gbk-play', '▶ Mainkan'); play.href = g.href; act.append(play);
        if (g.tentang) { var ab = el('a', 'gbk-about', 'ℹ Capaian & tujuan BK'); ab.href = g.tentang; act.append(ab); }
        box.append(x, el('h3', '', g.judul), el('span', 'gbk-lbl', g.label), el('p', '', g.isi), tags, act);
        ov.append(box); ov.hidden = false; x.focus();
      }
      ov.addEventListener('mousedown', function (e) { if (e.target === ov) tutupInfo(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !ov.hidden) tutupInfo(); });

      var ul = $('games');
      GAMES.forEach(function (g) {
        var li = el('li');
        var a = el('a', 'gbk-card'); a.href = g.href;
        var art = el('div', 'gbk-art' + (g.gambar ? ' has-img' : ''), g.gambar ? '' : g.ikon); art.setAttribute('aria-hidden', 'true');
        if (g.gambar) { var im = el('img'); im.src = g.gambar; im.alt = ''; im.loading = 'lazy'; im.onerror = function () { im.remove(); art.classList.remove('has-img'); art.insertBefore(document.createTextNode(g.ikon), art.firstChild); }; art.append(im); }
        art.append(el('small', '', g.label));
        var b = el('div', 'gbk-body');
        b.append(el('h2', '', g.judul), el('span', 'gbk-play', '▶ Mainkan'));
        a.append(art, b); li.append(a);
        var info = el('button', 'gbk-about', 'ℹ Info game'); info.type = 'button';
        info.addEventListener('click', function () { bukaInfo(g, info); });
        li.append(info);
        ul.append(li);
      });
      var soon = el('li');
      var sc = el('div', 'gbk-card gbk-soon');
      var sa = el('div', 'gbk-art', '🎮'); sa.setAttribute('aria-hidden', 'true');
      var sb = el('div', 'gbk-body'); sb.append(el('h2', '', 'Game berikutnya'), el('p', '', 'Segera hadir.'));
      sc.append(sa, sb); soon.append(sc); ul.append(soon);
    })();
  </script>
</body>
</html>
