const KEY="rpl_"+ID+"_v1";

const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
let S=load();
function newS(){return {setup:false,kelas:"",names:["Kelompok A","Kelompok B","Kelompok C","Kelompok D"],i:0,visited:{},tally:{},obs:{},hasil:{},notes:{},plans:{},g:null,turn:0,jalur:0,start:Date.now()}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.names)return Object.assign(newS(),s)}catch(e){}return null}
function save(){try{if(S)localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function modal(html){return new Promise(res=>{$("#mbox").innerHTML=html;$("#mod").classList.remove("hidden");$("#mbox").onclick=e=>{const b=e.target.closest("[data-v]");if(b){$("#mod").classList.add("hidden");res(b.dataset.v)}}})}
/* ---------- timer ---------- */
const TM={left:0,run:false,iv:null,id:null};
function tmReset(f){clearInterval(TM.iv);TM.run=false;TM.id=f.id;TM.left=f.menit*60;if(S.tm&&S.tm[f.id]!=null)TM.left=S.tm[f.id]}
function tmPaint(){const e=$("#tm");if(e){e.textContent=fmt(Math.max(0,TM.left));e.classList.toggle("low",TM.left<=60&&TM.left>0)}const b=$("#tmb");if(b)b.textContent=TM.run?"⏸":"▶"}
function tmToggle(){
  if(TM.run){clearInterval(TM.iv);TM.run=false}
  else{TM.run=true;TM.iv=setInterval(()=>{TM.left--;S.tm=S.tm||{};S.tm[TM.id]=TM.left;if(TM.left<=0){clearInterval(TM.iv);TM.run=false;toast("⏰ Waktu fase habis")}tmPaint();if(TM.left%10===0)save()},1000)}
  tmPaint();
}

const noteBox=(id,j,p)=>`<div class="card"><h3>${j||"📝 Catatan guru"}</h3><textarea data-note="${id}" placeholder="${esc(p||"Catat hal penting yang Anda amati…")}">${esc(S.notes[id]||"")}</textarea></div>`;

function bodyFase(f){

   {name:"Asesmen Awal",w:[40,80],head:0,rows:[["Pertanyaan pemantik","Catatan guru"],[RPL.pemantik,(RPL.tally?"Sebaran: "+RPL.tally.map(k=>k+" "+(S.tally[k]||0)).join(", ")+"\n":"")+(S.notes.awal||"")]]},
   {name:"Observasi Proses",w:[22,24,24,24,24],head:0,rows:Mx("obs",RPL.indProses)},
   {name:"Asesmen Akhir",w:[22,40,40,40],head:0,rows:[...Mx("hasil",RPL.indHasil),[],["Catatan observasi",S.notes.akhir||""]]},
   {name:"Rencana Kelompok",w:[22,...FIELDS.map(()=>38)],head:0,rows:[["Kelompok",...FIELDS.map(f=>f.l)],...S.names.map((n,i)=>[n,...FIELDS.map(f=>(S.plans[i]||{})[f.k]||"")])]},
   {name:"Hasil Permainan",w:GAME_COLS.map((_,i)=>i?16:24),head:0,rows:gr.length?[GAME_COLS,...gr]:[["Permainan belum dimainkan"]]},
   {name:"Catatan Guru",w:[40,90],head:0,rows:[["Fase","Catatan"],...FASE.filter(f=>S.notes[f.id]).map(f=>[f.judul,S.notes[f.id]])]}
  ];
  const blob=buildXlsx(sheets),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=`RPL-${ID}${S.kelas?"-"+S.kelas.replace(/[^\w-]+/g,""):""}-${new Date().toISOString().slice(0,10)}.xlsx`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Berkas Excel diunduh");
}
$ttl();
renderSetupScreen();
</script>
